<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELYRO - Fiche prospect</title>
    <meta name="robots" content="noindex">
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <meta name="theme-color" content="#F6F2EA">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F2EA'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' transform='rotate(45 16 16)' fill='%234F6353'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="zelyro.css">
    <style>
        .content-wrapper { grid-template-columns: 1.3fr 1fr; }
        .form-row { grid-template-columns: 1fr 1fr; }
        @media (max-width: 700px) { .form-row { grid-template-columns: 1fr; } }
    </style>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script src="/pwa.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';

        // Reproduit la logique du serveur pour expliquer le classement à
        // l'agent. Si les seuils changent côté backend, il faut les changer
        // ici aussi — c'est le prix de l'explication en direct.
        // Coordonnées : la moitié des points pour un e-mail plausible, l'autre
        // moitié pour un numéro plausible (mêmes règles que le serveur).
        function coordonnees(lead, total) {
            const moitie = Math.floor(total / 2);
            const email = String(lead.email || '').trim();
            const chiffres = String(lead.phone || '').replace(/\D/g, '');
            return {
                email: email.length <= 255 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? moitie : 0,
                phone: chiffres.length >= 8 && chiffres.length <= 15 ? total - moitie : 0
            };
        }

        // Numéro au format international sans « + » (06 12 34 56 78 -> 33612345678), pour tel: et WhatsApp.
        function numeroInternational(tel) {
            var d = String(tel || '').replace(/[^\d+]/g, '');
            if (!d) return '';
            if (d.charAt(0) === '+') return d.slice(1).replace(/\D/g, '');
            if (d.slice(0, 2) === '00') return d.slice(2);
            if (d.charAt(0) === '0' && d.length === 10) return '33' + d.slice(1);
            return d;
        }
        // Prénom pour le message, sauf nom provisoire donné à un contact de portail.
        function prenomPourMessage(nom) {
            var n = String(nom || '').trim();
            if (!n || /^Contact (LeBonCoin|SeLoger|\()/.test(n)) return '';
            return n.split(' ')[0];
        }

        // Engagement : ce que le prospect a fait avec les liens reçus (points calculés par le serveur).
        function ajouterEngagement(lead, ajouter) {
            var lignes = lead.engagement_lignes || [];
            var total = 0;
            lignes.forEach(function (l) { total += l[0]; ajouter(l[0], l[1]); });
            if (total > 12) ajouter(12 - total, 'Plafond de l\'engagement (12 points)');
            return Math.min(total, 12);
        }

        function expliquerQualite(lead) {
            if (lead.transaction === 'location') return expliquerQualiteLocataire(lead);
            const lignes = [];
            let points = 0;

            const fin = {
                approved: [36, 'Financement approuvé'],
                in_progress: [22, 'Financement en cours'],
                pending: [11, 'Financement en attente']
            }[lead.financing_status];
            if (fin) { points += fin[0]; lignes.push(`+${fin[0]} ${fin[1]}`); }

            const urg = {
                immediate: [32, 'Achat immédiat'],
                '1-3_months': [25, 'Achat sous 3 mois'],
                '3-6_months': [14, 'Achat sous 6 mois'],
                '6plus_months': [4, 'Achat au-delà de 6 mois']
            }[lead.purchase_urgency];
            if (urg) { points += urg[0]; lignes.push(`+${urg[0]} ${urg[1]}`); }

            const coord = coordonnees(lead, 8);
            if (coord.email) { points += coord.email; lignes.push(`+${coord.email} E-mail renseigné`); }
            if (coord.phone) { points += coord.phone; lignes.push(`+${coord.phone} Téléphone renseigné`); }
            if (lead.budget) { points += 5; lignes.push('+5 Budget renseigné'); }
            if (lead.location) { points += 4; lignes.push('+4 Secteur renseigné'); }
            if (lead.property_type) { points += 3; lignes.push('+3 Type de bien renseigné'); }
            points += ajouterEngagement(lead, (n, t) => lignes.push(`${n > 0 ? '+' : ''}${n} ${t}`));

            points = Math.min(100, points);
            const quality = points >= 80 ? 'hot' : points >= 45 ? 'warm' : 'cold';
            return { quality, points, lignes };
        }

        // Même calcul que _qualite_locataire côté serveur : solidité du dossier,
        // échéance et complétude. Revenus et loyer viennent du formulaire (texte).
        function expliquerQualiteLocataire(lead) {
            const lignes = [];
            let points = 0;
            const loyer = parseInt(lead.budget, 10) || 0;
            const revenus = parseInt(lead.revenus, 10) || 0;
            // Un local commercial ou un bureau se loue à un professionnel : on ne compte aucun garant.
            const garants = ['Local commercial', 'Bureau'].includes(lead.property_type) ? 0 : (parseInt(lead.garants, 10) || 0);
            const ajouter = (n, texte) => { points += n; lignes.push(`${n > 0 ? '+' : ''}${n} ${texte}`); };

            if (revenus && loyer) {
                const r = revenus / loyer;
                const txt = r.toFixed(1).replace('.', ',').replace(',0', '');
                if (r >= 3) ajouter(27, `Revenus de ${txt} fois le loyer`);
                else if (r >= 2.5) ajouter(18, `Revenus de ${txt} fois le loyer (3 fois exigés)`);
                else if (r >= 2) ajouter(9, `Revenus de ${txt} fois le loyer (3 fois exigés)`);
                else ajouter(3, `Revenus de ${txt} fois le loyer, insuffisants`);
                if (garants) ajouter(r >= 3 ? 4 : 11, 'Garant disponible');
            } else if (garants) {
                ajouter(13, 'Garant disponible');
            }

            const situation = { cdi: 13, fonctionnaire: 13, retraite: 11, independant: 8, cdd: 5, etudiant: 4, autre: 2 }[lead.situation_pro];
            if (situation) ajouter(situation, `Situation : ${(SITUATIONS.find((x) => x[0] === lead.situation_pro) || [])[1]}`);

            const urg = {
                immediate: [24, 'Emménagement immédiat'],
                '1-3_months': [19, 'Emménagement sous 3 mois'],
                '3-6_months': [10, 'Emménagement sous 6 mois'],
                '6plus_months': [3, 'Emménagement au-delà de 6 mois']
            }[lead.purchase_urgency];
            if (urg) ajouter(urg[0], urg[1]);

            const coord = coordonnees(lead, 8);
            if (coord.email) ajouter(coord.email, 'E-mail renseigné');
            if (coord.phone) ajouter(coord.phone, 'Téléphone renseigné');
            if (lead.budget) ajouter(5, 'Loyer maximum renseigné');
            if (lead.location) ajouter(4, 'Secteur renseigné');
            if (lead.property_type) ajouter(3, 'Type de bien renseigné');
            ajouterEngagement(lead, (n, t) => ajouter(n, t));

            points = Math.min(100, points);
            const quality = points >= 80 ? 'hot' : points >= 45 ? 'warm' : 'cold';
            return { quality, points, lignes };
        }

        const SITUATIONS = [
            ['cdi', 'CDI'], ['fonctionnaire', 'Fonctionnaire'], ['cdd', 'CDD ou intérim'],
            ['independant', "Indépendant ou chef d'entreprise"], ['retraite', 'Retraité'],
            ['etudiant', 'Étudiant'], ['autre', 'Autre']
        ];

        const LIBELLES = {
            hot: 'Acheteur actif',
            warm: 'Projet en cours',
            cold: 'Premier contact'
        };

        // Les valeurs sont celles du serveur (leads.status).
        const STATUTS = [
            ['nouveau', 'Nouveau'], ['contacte', 'Contacté'], ['visite', 'Visite'],
            ['offre', 'Offre'], ['signe', 'Signé'], ['perdu', 'Perdu']
        ];
        const SOURCES = {
            manuel: 'Ajouté à la main',
            import: 'Import de fichier',
            formulaire: 'Formulaire de contact',
            extraction: "Extrait d'un message",
            leboncoin: 'LeBonCoin',
            seloger: 'SeLoger',
            portail: 'E-mail transféré',
            api: 'API partenaire'
        };

        const deuxChiffres = (n) => String(n).padStart(2, '0');
        // Date du jour dans le fuseau de l'agent, au format AAAA-MM-JJ.
        const jourLocal = (decalage = 0) => {
            const d = new Date();
            d.setDate(d.getDate() + decalage);
            return `${d.getFullYear()}-${deuxChiffres(d.getMonth() + 1)}-${deuxChiffres(d.getDate())}`;
        };
        // « 2026-09-21 » -> 21 sept. 2026, sans passer par UTC (qui décalerait d'un jour).
        const dateCourte = (iso) => {
            const [a, m, j] = iso.split('-').map(Number);
            return new Date(a, m - 1, j).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        };
        const dateHeure = (iso) => new Date(iso).toLocaleString('fr-FR',
            { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

        function LeadProfile() {
            const [lead, setLead] = useState(null);
            const [form, setForm] = useState(null);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [error, setError] = useState(null);
            const [saved, setSaved] = useState(false);
            const [doublon, setDoublon] = useState(null);
            const [user, setUser] = useState(null);
            const [notes, setNotes] = useState([]);
            const [lienPerso, setLienPerso] = useState(null);
            const [lienCopie, setLienCopie] = useState(false);
            const [membres, setMembres] = useState([]);
            const [rappels, setRappels] = useState([]);
            const [rdvInfo, setRdvInfo] = useState(null);          // planning et rendez-vous ; null tant que non chargé
            const [messageRdv, setMessageRdv] = useState(null);
            const [lienRdv, setLienRdv] = useState(null);
            const [confirmerAnnulRdv, setConfirmerAnnulRdv] = useState(false);
            const [nouvelleNote, setNouvelleNote] = useState('');
            const [rappelDate, setRappelDate] = useState('');
            const [rappelTexte, setRappelTexte] = useState('');
            const [occupe, setOccupe] = useState(false);
            const [erreurSuivi, setErreurSuivi] = useState(null);
            const [confirmerSuppression, setConfirmerSuppression] = useState(false);

            const leadId = new URLSearchParams(window.location.search).get('id');

            useEffect(() => {
                const token = localStorage.getItem('token');
                const userData = localStorage.getItem('user');
                if (!token) {
                    window.location.replace('/login.html');
                    return;
                }
                if (userData) setUser(JSON.parse(userData));
                if (!leadId) {
                    setError("Aucun prospect indiqué dans l'adresse.");
                    setLoading(false);
                    return;
                }
                fetchLead(token);
                chargerSuivi();
                appel('/api/v1/team/members').then(setMembres).catch(() => {});
            }, []);

            const deconnecter = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.replace('/login.html');
            };

            // Appel authentifié : renvoie le JSON, ou lève une erreur avec le
            // message du serveur.
            const appel = async (chemin, options = {}) => {
                const r = await fetch(`${API_URL}${chemin}`, {
                    ...options,
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}`, 'Content-Type': 'application/json' }
                });
                if (r.status === 401) { deconnecter(); throw new Error('Session expirée'); }
                if (!r.ok) {
                    let message = `Erreur ${r.status}`;
                    try { const j = await r.json(); if (j.message) message = j.message; } catch (e) { /* corps vide */ }
                    throw new Error(message);
                }
                return r.json();
            };

            const chargerSuivi = async () => {
                try {
                    const [n, r, rdv] = await Promise.all([
                        appel(`/api/v1/leads/${leadId}/notes`),
                        appel(`/api/v1/leads/${leadId}/reminders`),
                        appel(`/api/v1/leads/${leadId}/rdv`).catch(() => null)
                    ]);
                    setNotes(n);
                    setRappels(r);
                    setRdvInfo(rdv);
                } catch (err) {
                    setErreurSuivi(err.message);
                }
            };

            // Chaque action du suivi suit le même chemin : on l'exécute, on
            // recharge, et une erreur s'affiche au lieu de disparaître.
            const agir = async (action) => {
                setOccupe(true);
                setErreurSuivi(null);
                try { await action(); await chargerSuivi(); }
                catch (err) { setErreurSuivi(err.message); }
                finally { setOccupe(false); }
            };

            const changerStatut = (statut) => agir(async () => {
                await appel(`/api/v1/leads/${leadId}/status`, { method: 'PUT', body: JSON.stringify({ status: statut }) });
                setLead((l) => ({ ...l, status: statut }));
            });

            // Confier le prospect à un collaborateur (ou à personne).
            const changerResponsable = (valeur) => agir(async () => {
                const cible = valeur === '' ? null : Number(valeur);
                await appel(`/api/v1/leads/${leadId}/assign`, { method: 'PUT', body: JSON.stringify({ user_id: cible }) });
                setLead((l) => ({ ...l, assigned_to: cible }));
            });

            const ajouterNote = () => agir(async () => {
                if (!nouvelleNote.trim()) return;
                await appel(`/api/v1/leads/${leadId}/notes`, { method: 'POST', body: JSON.stringify({ body: nouvelleNote }) });
                setNouvelleNote('');
            });

            // Lien personnel du formulaire + message prêt à coller (messagerie du
            // portail, SMS, WhatsApp) : sert surtout quand l'e-mail est inconnu.
            const copierLien = () => agir(async () => {
                const d = await appel(`/api/v1/leads/${leadId}/completion-link`, { method: 'POST' });
                setLienPerso(d);
                try { await navigator.clipboard.writeText(d.message); setLienCopie(true); }
                catch (e) { setLienCopie(false); }
            });

            // Planning de rendez-vous : envoi par e-mail, ou lien à coller (SMS, WhatsApp, messagerie du portail).
            const envoyerPlanning = () => agir(async () => {
                setMessageRdv(null);
                const d = await appel(`/api/v1/leads/${leadId}/rdv/envoyer`, { method: 'POST', body: JSON.stringify({ canal: 'email' }) });
                setLienRdv(null);
                setMessageRdv({ type: 'success', text: 'Planning envoyé par e-mail. Le rendez-vous apparaîtra ici dès que le prospect aura choisi un créneau.' });
            });
            const copierPlanning = () => agir(async () => {
                setMessageRdv(null);
                const d = await appel(`/api/v1/leads/${leadId}/rdv/envoyer`, { method: 'POST', body: JSON.stringify({ canal: 'lien' }) });
                let copie = false;
                try { await navigator.clipboard.writeText(d.message); copie = true; } catch (e) { copie = false; }
                setLienRdv({ message: d.message, copie });
            });
            const annulerRdv = () => agir(async () => {
                setMessageRdv(null);
                await appel(`/api/v1/leads/${leadId}/rdv`, { method: 'DELETE' });
                setConfirmerAnnulRdv(false);
                setLienRdv(null);
                setMessageRdv({ type: 'success', text: 'Rendez-vous annulé. Le prospect est prévenu et peut choisir un autre créneau.' });
            });

            const supprimerNote = (id) => agir(() => appel(`/api/v1/leads/${leadId}/notes/${id}`, { method: 'DELETE' }));

            const ajouterRappel = () => agir(async () => {
                if (!rappelDate) throw new Error('Choisissez une date de relance.');
                await appel(`/api/v1/leads/${leadId}/reminders`, {
                    method: 'POST', body: JSON.stringify({ due_date: rappelDate, label: rappelTexte })
                });
                setRappelDate('');
                setRappelTexte('');
            });

            const basculerRappel = (r) => agir(() => appel(`/api/v1/reminders/${r.id}`, {
                method: 'PUT', body: JSON.stringify({ done: !r.done_at })
            }));

            const supprimerRappel = (id) => agir(() => appel(`/api/v1/reminders/${id}`, { method: 'DELETE' }));

            const supprimerProspect = async () => {
                setOccupe(true);
                try {
                    await appel(`/api/v1/leads/${leadId}`, { method: 'DELETE' });
                    window.location.replace('/prospects.html');
                } catch (err) {
                    setErreurSuivi(err.message);
                    setOccupe(false);
                }
            };

            const fetchLead = async (token) => {
                try {
                    setLoading(true);
                    const response = await fetch(`${API_URL}/api/v1/leads/${leadId}`, {
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                    });
                    if (!response.ok) {
                        if (response.status === 401) {
                            localStorage.removeItem('token');
                            localStorage.removeItem('user');
                            window.location.replace('/login.html');
                            return;
                        }
                        if (response.status === 404) throw new Error("Ce prospect n'existe pas, ou n'appartient pas à votre agence.");
                        throw new Error(`Erreur API: ${response.status}`);
                    }
                    const data = await response.json();
                    setLead(data);
                    setForm({
                        name: data.name ?? '',
                        email: data.email ?? '',
                        phone: data.phone ?? '',
                        budget: data.budget ?? '',
                        location: data.location ?? '',
                        property_type: data.property_type ?? '',
                        surface_min: data.surface_min ?? '',
                        activite: data.activite ?? '',
                        financing_status: data.financing_status ?? 'unknown',
                        purchase_urgency: data.purchase_urgency ?? 'unknown',
                        financing_amount: data.financing_amount ?? '',
                        transaction: data.transaction === 'location' ? 'location' : 'vente',
                        revenus: data.revenus ?? '',
                        garants: data.garants ?? '',
                        situation_pro: data.situation_pro ?? '',
                        meuble_souhaite: data.meuble_souhaite === true ? 'oui' : data.meuble_souhaite === false ? 'non' : '',
                        notes: data.notes ?? ''
                    });
                    setError(null);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSave = async (confirmerDoublon) => {
                const token = localStorage.getItem('token');
                if (!form.name.trim()) {
                    setError('Le nom du prospect est obligatoire.');
                    return;
                }
                setSaving(true);
                setSaved(false);
                setDoublon(null);
                try {
                    const response = await fetch(`${API_URL}/api/v1/leads/${leadId}/update-financing`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: form.name.trim(),
                            email: form.email.trim() || null,
                            phone: form.phone.trim() || null,
                            confirm_duplicate: confirmerDoublon === true,
                            budget: form.budget === '' ? null : parseInt(form.budget, 10),
                            location: form.location || null,
                            property_type: form.property_type || null,
                            surface_min: ['Local commercial', 'Bureau'].includes(form.property_type) && form.surface_min !== '' ? parseInt(form.surface_min, 10) : null,
                            activite: ['Local commercial', 'Bureau'].includes(form.property_type) && form.activite ? form.activite : null,
                            financing_status: form.financing_status,
                            purchase_urgency: form.purchase_urgency,
                            financing_amount: form.financing_amount === '' ? null : parseInt(form.financing_amount, 10),
                            transaction: form.transaction,
                            // Le dossier du locataire n'a de sens que pour une location : on ne l'efface pas si l'agent bascule en achat.
                            ...(form.transaction === 'location' ? {
                                revenus: form.revenus === '' ? null : parseInt(form.revenus, 10),
                                garants: form.garants === '' || ['Local commercial', 'Bureau'].includes(form.property_type) ? null : parseInt(form.garants, 10),
                                situation_pro: form.situation_pro || null,
                                meuble_souhaite: form.meuble_souhaite === '' ? null : form.meuble_souhaite === 'oui'
                            } : {}),
                            notes: form.notes || null
                        })
                    });
                    if (!response.ok) {
                        const d = await response.json().catch(() => ({}));
                        if (response.status === 409 && d.duplicate) {
                            // Un autre prospect porte déjà cet e-mail ou ce numéro : on laisse l'agent décider.
                            setDoublon(d.message);
                            setError(null);
                            return;
                        }
                        throw new Error(d.message || `Enregistrement impossible (${response.status})`);
                    }
                    setSaved(true);
                    setError(null);
                    // On relit la fiche : la qualité est recalculée par le
                    // serveur, on ne la devine pas côté navigateur.
                    await fetchLead(token);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setSaving(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.replace('/login.html');
            };

            const set = (k, v) => { setForm({ ...form, [k]: v }); setSaved(false); setDoublon(null); };

            const apercu = form ? expliquerQualite({
                financing_status: form.financing_status,
                purchase_urgency: form.purchase_urgency,
                budget: form.budget,
                location: form.location,
                property_type: form.property_type,
                email: form.email,
                phone: form.phone,
                engagement_lignes: lead ? lead.engagement_lignes : [],
                transaction: form.transaction,
                revenus: form.revenus,
                garants: form.garants,
                situation_pro: form.situation_pro
            }) : null;
            const location = !!form && form.transaction === 'location';

            return (
                <>
                    <header>
                        <div className="header-content">
                            <div className="logo"><a href="/taches.html" aria-label="Zelyro, mes tâches du jour" style={{ color: 'inherit', textDecoration: 'none' }}>ZELYRO</a></div>
                            <nav>
                                <a href="/taches.html">À faire</a>
                                <a href="/prospects.html">Leads</a>
                                <a href="/biens.html">Biens</a>
                                <a href="/matching.html">Matching</a>
                                <a href="/propositions.html">Propositions</a>
                                <a href="/dashboard.html">Dashboard</a>
                                <a href="/compte.html">Compte</a>
                                {user && user.is_admin && <a href="/admin.html">Admin</a>}
                            </nav>
                            <div className="user-info">
                                {user && <span className="user-email">{user.email}</span>}
                                <button className="logout-btn" onClick={handleLogout}>Déconnexion</button>
                            </div>
                        </div>
                    </header>

                    <div className="container">
                        <a href="/prospects.html" className="back-link">← Retour aux prospects</a>

                        {loading ? (
                            <div className="loading">
                                <div className="loader"></div>
                                <p style={{ marginTop: '20px' }}>Chargement de la fiche...</p>
                            </div>
                        ) : error && !lead ? (
                            <div className="error">{error}</div>
                        ) : lead ? (
                            <>
                                <h1 className="page-title">{lead.name}</h1>

                                                            { day: 'numeric', month: 'long', year: 'numeric' })
                                                        : 'Date inconnue'}
                                                </div>
                                            </div>
                                            <div className="detail-block">
                                                <div className="detail-label">Référence</div>
                                                <div className="detail-value">Lead #{lead.id}</div>
                                            </div>
                                        </div>

                                        <div className="panel">
                                            <div className="panel-title">Supprimer ce prospect</div>
                                            <div className="panel-note">
                                                Efface définitivement la fiche, ses notes, ses relances et son
                                                historique. À utiliser pour une demande d'effacement de ses données,
                                                pour retirer un doublon, ou si cette fiche vient d'une notification
                                                LeBonCoin/SeLoger qui n'était pas une vraie demande de contact
                                                (dites-le-nous si ça arrive : le tri automatique s'améliore avec
                                                chaque cas signalé). Cette action est irréversible.
                                            </div>
                                            {!confirmerSuppression ? (
                                                <button className="btn danger petit" onClick={() => setConfirmerSuppression(true)}>
                                                    Supprimer ce prospect
                                                </button>
                                            ) : (
                                                <div className="btn-ligne">
                                                    <button className="btn danger plein petit" disabled={occupe} onClick={supprimerProspect}>
                                                        Oui, supprimer définitivement
                                                    </button>
                                                    <button className="btn secondary petit" onClick={() => setConfirmerSuppression(false)}>
                                                        Annuler
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </>
                        ) : null}
                    </div>
                </>
            );
        }

        ReactDOM.render(<LeadProfile />, document.getElementById('root'));
    </script>
</body>
</html>
