<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Zelyro</title>
<meta name="theme-color" content="#14261D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F2EA'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' transform='rotate(45 16 16)' fill='%234F6353'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/zelyro.css">
<style>
    body.erreur404 { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
        background: radial-gradient(700px 480px at 12% 8%, rgba(212,177,95,.16), transparent 62%), linear-gradient(160deg, var(--deep-green), var(--deep-green-2)); color: #F6F2EA; }
    .erreur404 .carte { max-width: 520px; }
    .erreur404 .marque { display: inline-flex; align-items: center; gap: 12px; font-family: var(--serif); font-size: 26px; letter-spacing: .14em; color: #F6F2EA; text-decoration: none; margin-bottom: 36px; }
    .erreur404 .marque::before { content: ""; width: 11px; height: 11px; background: var(--laiton); border-radius: 2px; transform: rotate(45deg); }
    .erreur404 .code { font-family: var(--serif); font-size: clamp(72px, 18vw, 128px); line-height: 1; color: var(--laiton); margin: 0 0 8px; font-weight: 500; }
    .erreur404 h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(26px, 5vw, 36px); margin: 0 0 14px; color: #F6F2EA; }
    .erreur404 p { color: #C9D3C3; font-size: 17px; line-height: 1.6; margin: 0 0 30px; }
    .erreur404 .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .erreur404 a.bouton { display: inline-block; padding: 14px 26px; border-radius: 10px; font-weight: 600; text-decoration: none; min-height: 44px; }
    .erreur404 a.principal { background: var(--laiton); color: #14221A; }
    .erreur404 a.secondaire { border: 1px solid rgba(246,242,234,.45); color: #F6F2EA; }
    .erreur404 a:focus-visible { outline: 2px solid var(--laiton); outline-offset: 3px; }
</style>
</head>
<body class="erreur404">
<main class="carte">
    <a class="marque" href="/" aria-label="Zelyro, retour à l'accueil">ZELYRO</a>
    <p class="code" aria-hidden="true">404</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être ancien, ou l'adresse contient une faute de frappe. Retrouvez votre chemin depuis l'accueil, ou connectez-vous à votre espace.</p>
    <div class="actions">
        <a class="bouton principal" href="/">Retour à l'accueil</a>
        <a class="bouton secondaire" href="/login.html">Me connecter</a>
    </div>
</main>
</body>
</html>
