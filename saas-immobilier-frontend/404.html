<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Zelyro</title>
<meta name="theme-color" content="#14261D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F3F4F1'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' transform='rotate(45 16 16)' fill='%234A504C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/zelyro.css">
<style>
    body.erreur404 { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
        background: var(--ink); color: #F2F3F0; }
    .erreur404 .carte { max-width: 520px; }
    .erreur404 .marque { display: inline-flex; align-items: center; gap: 12px; font-family: var(--titre); font-weight: 700; font-size: 28px; letter-spacing: -.025em; color: #F2F3F0; text-decoration: none; margin-bottom: 36px; }
    .erreur404 .marque::before { content: ""; width: 13px; height: 13px; background: #B7BBB6; border-radius: 3px; transform: rotate(45deg); }
    .erreur404 .code { font-family: var(--titre); font-size: clamp(88px, 22vw, 168px); line-height: .95; color: var(--go); margin: 0 0 12px; font-weight: 700; letter-spacing: -.05em; }
    .erreur404 h1 { font-family: var(--titre); font-weight: 700; letter-spacing: -.025em; font-size: clamp(28px, 5vw, 40px); margin: 0 0 14px; color: #F2F3F0; }
    .erreur404 p { color: #B2B7B2; font-size: 17px; line-height: 1.6; margin: 0 0 30px; }
    .erreur404 .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .erreur404 a.bouton { display: inline-block; padding: 14px 26px; border-radius: 6px; font-weight: 700; text-decoration: none; min-height: 44px; }
    .erreur404 a.principal { background: var(--go); color: #0A0D0B; border: 1px solid var(--go); }
    .erreur404 a.secondaire { border: 1px solid rgba(242,243,240,.5); color: #F2F3F0; }
    .erreur404 a.secondaire:hover { background: #F2F3F0; color: #0A0D0B; }
    .erreur404 a:focus-visible { outline: 2px solid var(--laiton); outline-offset: 3px; }
</style>
</head>
<body class="erreur404">
<main class="carte">
    <a class="marque" href="/" aria-label="Zelyro, retour à l'accueil">Zelyro</a>
    <p class="code" aria-hidden="true">404</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être ancien, ou l'adresse contient une faute de frappe. Retrouvez votre chemin depuis l'accueil, ou connectez-vous à votre espace.</p>
    <div class="actions">
        <a class="bouton principal" href="/">Retour à l'accueil</a>
        <a class="bouton secondaire" href="/login.html">Me connecter</a>
    </div>
</main>
</body>
</html>
