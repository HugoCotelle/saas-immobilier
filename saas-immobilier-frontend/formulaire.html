<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez votre agence</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F6F2EA">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F2EA'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' transform='rotate(45 16 16)' fill='%234F6353'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="zelyro.css">
    <style>
        body.auth { align-items: flex-start; }
        .form-carte { max-width: 620px; margin: 24px auto; }
        .form-carte .auth-header h1 { font-size: 30px; letter-spacing: 0.02em; }
        .form-carte .auth-header h1::before { display: none; }
        .form-carte .form-row { grid-template-columns: 1fr 1fr; }
        @media (max-width: 600px) { .form-carte .form-row { grid-template-columns: 1fr; } }
        .piege { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .consentement { display: flex; gap: 12px; align-items: flex-start; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 400; color: var(--ink-2); line-height: 1.6; cursor: pointer; margin-bottom: 0; }
        .consentement input { width: 18px; height: 18px; margin-top: 3px; flex: none; padding: 0; accent-color: var(--sage-600); }
        .consentement a { color: var(--sage-700); }
        .pied-formulaire { text-align: center; margin-top: 22px; font-size: 12px; color: var(--ink-3); line-height: 1.7; }
        .pied-formulaire a { color: var(--ink-3); }
        .form-carte button[type=submit] { margin-top: 22px; }
        .masque { display: none; }
        .champ-erreur { color: var(--danger); font-size: 12px; margin-top: 6px; }
    </style>
<script src="/stats.js" defer></script>
</head>
<body class="auth">
    <main class="auth-container form-carte" id="carte">
        <div class="auth-header">
            <h1 id="titre">Contactez-nous</h1>
            <p id="sous-titre">Décrivez votre projet : un conseiller vous recontacte.</p>
        </div>

        <div id="etat" class="loading masque"><div class="loader"></div></div>
        <div id="message" class="masque" role="status"></div>

        <form id="formulaire" class="masque" novalidate>
            <div class="form-group">
                <label for="name">Nom et prénom <span class="obligatoire">*</span></label>
                <input id="name" name="name" type="text" autocomplete="name" maxlength="255" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" maxlength="255">
                </div>
                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20">
                </div>
            </div>
            <p class="field-hint" style="margin: -8px 0 20px">Indiquez au moins un e-mail ou un téléphone pour que nous puissions vous répondre.</p>

            <div class="form-group">
                <label for="transaction">Votre projet</label>
                <select id="transaction" name="transaction">
                    <option value="vente">Acheter un bien</option>
                    <option value="location">Louer un bien</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="property_type">Type de bien</label>
                    <select id="property_type" name="property_type">
                        <option value="">Non précisé</option>
                        <option>Appartement</option>
                        <option>Maison</option>
                        <option>Villa</option>
                        <option>Studio</option>
                        <option>Penthouse</option>
                        <option>Terrain</option>
                        <option>Local commercial</option>
                        <option>Bureau</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">Secteur recherché</label>
                    <input id="location" name="location" type="text" maxlength="255" placeholder="Ville ou quartier">
                </div>
            </div>
            <div class="form-row masque" id="bloc-surface">
                <div class="form-group">
                    <label for="surface_min">Surface minimale recherchée (m²)</label>
                    <input id="surface_min" name="surface_min" type="number" min="0" max="1000000" inputmode="numeric" placeholder="120">
                </div>
                <div class="form-group">
                    <label for="activite">Activité envisagée</label>
                    <select id="activite" name="activite">
                        <option value="">Non précisée</option>
                        <option value="commerce">Commerce de détail</option>
                        <option value="restauration">Restauration</option>
                        <option value="services">Services ou profession libérale</option>
                        <option value="bureau">Bureaux</option>
                        <option value="artisanat">Artisanat ou activité</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="budget" id="label-budget">Budget (€)</label>
                    <input id="budget" name="budget" type="number" min="0" max="100000000" inputmode="numeric" placeholder="280000">
                </div>
                <div class="form-group" id="bloc-financement">
                    <label for="financing_status">Financement</label>
                    <select id="financing_status" name="financing_status">
                        <option value="unknown">Non précisé</option>
                        <option value="approved">J'ai un accord de la banque</option>
                        <option value="in_progress">Démarche en cours</option>
                    </select>
                </div>
            </div>
            <div class="form-row masque" id="bloc-dossier">
                <div class="form-group">
                    <label for="revenus">Revenus mensuels nets du foyer (€)</label>
                    <input id="revenus" name="revenus" type="number" min="0" max="10000000" inputmode="numeric" placeholder="2800">
                </div>
                <div class="form-group" id="groupe-garants">
                    <label for="garants">Avez-vous un garant ?</label>
                    <select id="garants" name="garants">
                        <option value="">Non précisé</option>
                        <option value="1">Oui</option>
                        <option value="0">Non</option>
                    </select>
                </div>
            </div>
            <div class="form-row masque" id="bloc-situation">
                <div class="form-group">
                    <label for="situation_pro">Situation professionnelle</label>
                    <select id="situation_pro" name="situation_pro">
                        <option value="">Non précisée</option>
                        <option value="cdi">CDI</option>
                        <option value="fonctionnaire">Fonctionnaire</option>
                        <option value="cdd">CDD ou intérim</option>
                        <option value="independant">Indépendant ou chef d'entreprise</option>
                        <option value="retraite">Retraité</option>
                        <option value="etudiant">Étudiant</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>
                <div class="form-group" id="bloc-meuble">
                    <label for="meuble_souhaite">Logement meublé ?</label>
                    <select id="meuble_souhaite" name="meuble_souhaite">
                        <option value="">Indifférent</option>
                        <option value="oui">Meublé</option>
                        <option value="non">Non meublé</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="purchase_urgency" id="label-echeance">Quand souhaitez-vous acheter ?</label>
                <select id="purchase_urgency" name="purchase_urgency">
                    <option value="unknown">Non précisé</option>
                    <option value="immediate">Dès que possible</option>
                    <option value="1-3_months">Dans 1 à 3 mois</option>
                    <option value="3-6_months">Dans 3 à 6 mois</option>
                    <option value="6plus_months">Dans plus de 6 mois</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message-libre">Votre message</label>
                <textarea id="message-libre" name="message" maxlength="1000" placeholder="Ce que vous recherchez, vos critères, vos disponibilités..."></textarea>
            </div>

            <!-- Piège à robots : un visiteur ne voit pas ce champ, un robot le remplit. -->
            <div class="piege" aria-hidden="true">
                <label for="website">Ne pas remplir</label>
                <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="consentement" for="consent">
                    <input id="consent" name="consent" type="checkbox">
                    <span>J'accepte d'être recontacté(e) par <strong id="agence-consent">l'agence</strong> au sujet de mon projet, et que les
                    informations saisies dans ce formulaire soient conservées à cette fin. Voir la
                    <a href="/confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>. <span class="obligatoire">*</span></span>
                </label>
                <div class="champ-erreur masque" id="erreur-consent">Cochez cette case pour envoyer votre demande.</div>
            </div>

            <button type="submit" id="envoyer">Envoyer ma demande</button>
        </form>

        <p class="pied-formulaire">Formulaire propulsé par Zelyro · <a href="/mentions-legales.html" target="_blank" rel="noopener">Mentions légales</a></p>
    </main>

    <script>
        (function () {
            var API_URL = 'https://saas-immobilier-921a.onrender.com';
            var jeton = new URLSearchParams(window.location.search).get('a') || '';
            var $ = function (id) { return document.getElementById(id); };
            var montrer = function (id, oui) { $(id).classList.toggle('masque', !oui); };
            var afficher = function (type, texte) {
                var m = $('message');
                m.className = type === 'error' ? 'error' : 'success';
                m.textContent = texte;
                m.style.textAlign = 'left';
            };

            function indisponible() {
                montrer('etat', false);
                montrer('formulaire', false);
                $('titre').textContent = 'Formulaire indisponible';
                $('sous-titre').textContent = "Ce lien n'est plus valable. Contactez directement l'agence pour lui faire part de votre projet.";
            }

            if (!/^[A-Za-z0-9_-]{16,64}$/.test(jeton)) { indisponible(); return; }

            montrer('etat', true);
            fetch(API_URL + '/public/capture/' + encodeURIComponent(jeton))
                .then(function (r) { if (!r.ok) throw new Error('indisponible'); return r.json(); })
                .then(function (d) {
                    var agence = d.agence || '';
                    if (agence) {
                        $('titre').textContent = 'Contactez ' + agence;
                        document.title = 'Contactez ' + agence;
                        $('agence-consent').textContent = agence;
                    }
                    montrer('etat', false);
                    montrer('formulaire', true);
                })
                .catch(function () { indisponible(); });

            // Pour un local commercial ou un bureau, la surface recherchée compte dans la mise en relation.
            var typePro = function () { var t = $('property_type').value; return t === 'Local commercial' || t === 'Bureau'; };
            // Vente ou location : le formulaire s'adapte (loyer, dossier du locataire, pas de financement).
            var enLocation = function () { return $('transaction').value === 'location'; };
            function adapter() {
                var loc = enLocation();
                $('label-budget').textContent = loc ? 'Loyer maximum (€ par mois)' : 'Budget (€)';
                $('budget').placeholder = loc ? '900' : '280000';
                $('label-echeance').textContent = loc ? 'Quand souhaitez-vous emménager ?' : 'Quand souhaitez-vous acheter ?';
                montrer('bloc-financement', !loc);
                montrer('bloc-dossier', loc);
                // Un local commercial ou un bureau se loue à un professionnel : pas de garant personnel.
                montrer('groupe-garants', !typePro());
                montrer('bloc-situation', loc);
                montrer('bloc-meuble', loc && !typePro());
                montrer('bloc-surface', typePro());
            }
            $('property_type').addEventListener('change', adapter);
            $('transaction').addEventListener('change', adapter);

            $('formulaire').addEventListener('submit', function (e) {
                e.preventDefault();
                montrer('erreur-consent', false);
                var nom = $('name').value.trim(), email = $('email').value.trim(), tel = $('phone').value.trim();
                if (!nom) { afficher('error', 'Indiquez votre nom.'); $('name').focus(); return; }
                if (!email && !tel) { afficher('error', 'Indiquez un e-mail ou un téléphone pour être recontacté.'); return; }
                if (!$('consent').checked) { montrer('erreur-consent', true); $('consent').focus(); return; }
                montrer('message', false);

                var budget = $('budget').value === '' ? null : parseInt($('budget').value, 10);
                var surface = typePro() && $('surface_min').value !== '' ? parseInt($('surface_min').value, 10) : null;
                var bouton = $('envoyer');
                bouton.disabled = true;
                bouton.textContent = 'Envoi…';
                fetch(API_URL + '/public/capture/' + encodeURIComponent(jeton), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nom,
                        email: email || null,
                        phone: tel || null,
                        budget: budget,
                        location: $('location').value.trim() || null,
                        property_type: $('property_type').value || null,
                        surface_min: surface,
                        activite: typePro() && $('activite').value ? $('activite').value : null,
                        transaction: $('transaction').value,
                        financing_status: enLocation() ? 'unknown' : $('financing_status').value,
                        purchase_urgency: $('purchase_urgency').value,
                        revenus: enLocation() && $('revenus').value !== '' ? parseInt($('revenus').value, 10) : null,
                        garants: enLocation() && !typePro() && $('garants').value !== '' ? parseInt($('garants').value, 10) : null,
                        situation_pro: enLocation() && $('situation_pro').value ? $('situation_pro').value : null,
                        meuble_souhaite: enLocation() && !typePro() && $('meuble_souhaite').value ? $('meuble_souhaite').value === 'oui' : null,
                        message: $('message-libre').value.trim() || null,
                        website: $('website').value,
                        consent: true
                    })
                }).then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
                }).then(function (res) {
                    if (res.ok) {
                        montrer('formulaire', false);
                        $('titre').textContent = 'Merci !';
                        $('sous-titre').textContent = 'Votre demande a bien été envoyée. Un conseiller vous recontactera très prochainement.';
                    } else if (res.status === 429) {
                        afficher('error', 'Trop de demandes envoyées depuis cette connexion. Réessayez un peu plus tard.');
                    } else {
                        afficher('error', res.d.message || "L'envoi a échoué. Réessayez dans un instant.");
                    }
                }).catch(function () {
                    afficher('error', 'Impossible de joindre le serveur. Vérifiez votre connexion et réessayez.');
                }).then(function () {
                    bouton.disabled = false;
                    bouton.textContent = 'Envoyer ma demande';
                });
            });
        })();
    </script>
</body>
</html>
