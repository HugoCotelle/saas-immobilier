<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELYRO - Connexion</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto'; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-container { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); width: 100%; max-width: 420px; padding: 40px; }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h1 { color: #333; font-size: 30px; letter-spacing: 0.08em; margin-bottom: 10px; }
        .auth-header p { color: #999; font-size: 14px; line-height: 1.5; }
        .tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 1px solid #e0e0e0; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; color: #999; font-weight: 500; transition: all 0.3s ease; }
        .tab.active { border-bottom-color: #667eea; color: #667eea; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #333; font-weight: 500; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 5px; font-size: 14px; font-family: inherit; }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 5px; font-weight: 600; font-size: 14px; font-family: inherit; cursor: pointer; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3); }
        button:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }
        .error { background: #fee; color: #c33; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; }
        .success { background: #efe; color: #2d7a3e; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';

        function AuthApp() {
            const [activeTab, setActiveTab] = useState('login');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);
            const [loginData, setLoginData] = useState({ email: '', password: '' });
            const [signupData, setSignupData] = useState({
                email: '', password: '', confirmPassword: '', firstName: '', companyName: ''
            });

            useEffect(() => {
                const token = localStorage.getItem('token');
                if (token) window.location.href = '/index.html';
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setMessage(null);
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(loginData)
                    });
                    const data = await response.json();
                    if (response.ok) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        setMessage({ type: 'success', text: 'Connexion réussie, redirection…' });
                        setTimeout(() => { window.location.href = '/index.html'; }, 1000);
                    } else {
                        setMessage({ type: 'error', text: data.message || 'Identifiants incorrects' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Serveur injoignable : ' + error.message });
                } finally {
                    setLoading(false);
                }
            };

            const handleSignup = async (e) => {
                e.preventDefault();
                setMessage(null);
                if (signupData.password !== signupData.confirmPassword) {
                    setMessage({ type: 'error', text: 'Les mots de passe ne correspondent pas' });
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/auth/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: signupData.email,
                            password: signupData.password,
                            first_name: signupData.firstName,
                            company_name: signupData.companyName
                        })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        setMessage({ type: 'success', text: 'Compte créé, redirection…' });
                        setTimeout(() => { window.location.href = '/index.html'; }, 1000);
                    } else {
                        setMessage({ type: 'error', text: data.message || 'Inscription impossible' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Serveur injoignable : ' + error.message });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-container">
                    <div className="auth-header">
                        <h1>ZELYRO</h1>
                        <p>Chaque lead. Chaque bien. Aucune opportunité perdue.</p>
                    </div>

                    {message && (
                        <div className={message.type === 'error' ? 'error' : 'success'}>
                            {message.text}
                        </div>
                    )}

                    <div className="tabs">
                        <div className={`tab ${activeTab === 'login' ? 'active' : ''}`}
                            onClick={() => { setActiveTab('login'); setMessage(null); }}>Connexion</div>
                        <div className={`tab ${activeTab === 'signup' ? 'active' : ''}`}
                            onClick={() => { setActiveTab('signup'); setMessage(null); }}>Inscription</div>
                    </div>

                    {activeTab === 'login' && (
                        <form onSubmit={handleLogin}>
                            <div className="form-group">
                                <label>Email</label>
                                <input type="email" value={loginData.email}
                                    onChange={(e) => setLoginData({ ...loginData, email: e.target.value })}
                                    placeholder="vous@agence.fr" required disabled={loading} />
                            </div>
                            <div className="form-group">
                                <label>Mot de passe</label>
                                <input type="password" value={loginData.password}
                                    onChange={(e) => setLoginData({ ...loginData, password: e.target.value })}
                                    placeholder="••••••••" required disabled={loading} />
                            </div>
                            <button type="submit" disabled={loading}>
                                {loading ? 'Connexion…' : 'Se connecter'}
                            </button>
                        </form>
                    )}

                    {activeTab === 'signup' && (
                        <form onSubmit={handleSignup}>
                            <div className="form-group">
                                <label>Email</label>
                                <input type="email" value={signupData.email}
                                    onChange={(e) => setSignupData({ ...signupData, email: e.target.value })}
                                    placeholder="vous@agence.fr" required disabled={loading} />
                            </div>
                            <div className="form-group">
                                <label>Prénom</label>
                                <input type="text" value={signupData.firstName}
                                    onChange={(e) => setSignupData({ ...signupData, firstName: e.target.value })}
                                    placeholder="Tom" disabled={loading} />
                            </div>
                            <div className="form-group">
                                <label>Agence</label>
                                <input type="text" value={signupData.companyName}
                                    onChange={(e) => setSignupData({ ...signupData, companyName: e.target.value })}
                                    placeholder="Nom de votre agence" disabled={loading} />
                            </div>
                            <div className="form-group">
                                <label>Mot de passe</label>
                                <input type="password" value={signupData.password}
                                    onChange={(e) => setSignupData({ ...signupData, password: e.target.value })}
                                    placeholder="••••••••" required disabled={loading} />
                            </div>
                            <div className="form-group">
                                <label>Confirmer le mot de passe</label>
                                <input type="password" value={signupData.confirmPassword}
                                    onChange={(e) => setSignupData({ ...signupData, confirmPassword: e.target.value })}
                                    placeholder="••••••••" required disabled={loading} />
                            </div>
                            <button type="submit" disabled={loading}>
                                {loading ? 'Création…' : "S'inscrire"}
                            </button>
                        </form>
                    )}
                </div>
            );
        }

        ReactDOM.render(<AuthApp />, document.getElementById('root'));
    </script>
</body>
</html>
