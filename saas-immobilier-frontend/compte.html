<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELYRO - Mon compte</title>
    <meta name="robots" content="noindex">
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <meta name="theme-color" content="#F6F2EA">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F2EA'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' transform='rotate(45 16 16)' fill='%234F6353'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="zelyro.css">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';
        const VIDE = { actuel: '', nouveau: '', confirmation: '' };

        function App() {
            const [user, setUser] = useState(null);
            const [form, setForm] = useState(VIDE);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState(null);
            const [alertes, setAlertes] = useState(null);      // null tant que non chargé
            const [messageAlertes, setMessageAlertes] = useState(null);
            const [lien, setLien] = useState(null);
            const [messageLien, setMessageLien] = useState(null);
            const [confirmerLien, setConfirmerLien] = useState(false);
            const [forfait, setForfait] = useState(null);
            const [gmailStatus, setGmailStatus] = useState(null);
            const [messageGmail, setMessageGmail] = useState(null);
            const [connectingGmail, setConnectingGmail] = useState(false);
            const [syncingGmail, setSyncingGmail] = useState(false);
            const [confirmerDeconnexionGmail, setConfirmerDeconnexionGmail] = useState(false);
            const [team, setTeam] = useState(null);
            const [messageTeam, setMessageTeam] = useState(null);
            const [inviteEmail, setInviteEmail] = useState('');
            const [inviting, setInviting] = useState(false);
            const [confirmerRetrait, setConfirmerRetrait] = useState(null);
            const [busyTeamId, setBusyTeamId] = useState(null);

            const appel = async (chemin, options = {}) => {
                const r = await fetch(`${API_URL}${chemin}`, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (r.status === 401) { handleLogout(); throw new Error('Session expirée'); }
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data.message || `Erreur ${r.status}`);
                return data;
            };

            useEffect(() => {
                if (!localStorage.getItem('token')) {
                    window.location.replace('/login.html');
                    return;
                }
                const userData = localStorage.getItem('user');
                if (userData) setUser(JSON.parse(userData));
                appel('/auth/profile').then((p) => {
                    setAlertes(p.alerts_enabled !== false);
                    // Met à jour ce que le navigateur sait du compte (forfait, rôle, droits d'administration).
                    try {
                        const u = JSON.parse(localStorage.getItem('user') || '{}');
                        const maj = { ...u, plan: p.plan, role: p.role, is_admin: p.is_admin === true };
                        localStorage.setItem('user', JSON.stringify(maj));
                        setUser(maj);
                        if (p.role === 'admin') chargerEquipe();
                    } catch (e) { /* sans importance */ }
                }).catch(() => {});
                appel('/api/v1/plan').then(setForfait).catch(() => {});
                appel('/api/v1/capture-link').then(setLien).catch((e) => setMessageLien({ type: 'error', text: e.message }));
                appel('/api/v1/gmail/status').then(setGmailStatus).catch((e) => setMessageGmail({ type: 'error', text: e.message }));

                // Google renvoie ici le navigateur après le consentement (ou son refus) :
                // ?gmail=connecte|refuse|erreur. On affiche le message une fois puis on
                // nettoie l'URL, pour ne pas le rejouer si la page est rechargée.
                const parametresGmail = new URLSearchParams(window.location.search);
                const resultatGmail = parametresGmail.get('gmail');
                if (resultatGmail) {
                    if (resultatGmail === 'connecte') {
                        setMessageGmail({ type: 'success', text: 'Boîte Gmail connectée : Zelyro va maintenant y détecter automatiquement les notifications LeBonCoin et SeLoger.' });
                    } else if (resultatGmail === 'refuse') {
                        setMessageGmail({ type: 'error', text: 'Connexion annulée : l\'autorisation n\'a pas été accordée.' });
                    } else {
                        setMessageGmail({ type: 'error', text: 'La connexion à Gmail a échoué. Réessayez, ou contactez-nous si le problème persiste.' });
                    }
                    window.history.replaceState({}, '', window.location.pathname);
                }
            }, []);

            const changerAlertes = async (valeur) => {
                setAlertes(valeur);
                setMessageAlertes(null);
                try {
                    await appel('/auth/preferences', { method: 'PUT', body: JSON.stringify({ alerts_enabled: valeur }) });
                    setMessageAlertes({ type: 'success', text: valeur ? 'Alertes activées.' : 'Alertes désactivées.' });
                } catch (e) {
                    setAlertes(!valeur);
                    setMessageAlertes({ type: 'error', text: e.message });
                }
            };

            const copier = async () => {
                try {
                    await navigator.clipboard.writeText(lien.url);
                    setMessageLien({ type: 'success', text: 'Adresse copiée.' });
                } catch (e) {
                    document.getElementById('champ-lien').select();
                    setMessageLien({ type: 'error', text: 'Copie automatique impossible : l\'adresse est sélectionnée, copiez-la avec Ctrl+C.' });
                }
            };

            const nouveauLien = async () => {
                setConfirmerLien(false);
                try {
                    setLien(await appel('/api/v1/capture-link/regenerate', { method: 'POST' }));
                    setMessageLien({ type: 'success', text: 'Nouvelle adresse créée. L\'ancienne ne fonctionne plus.' });
                } catch (e) {
                    setMessageLien({ type: 'error', text: e.message });
                }
            };

            const connecterGmail = async () => {
                setConnectingGmail(true);
                setMessageGmail(null);
                try {
                    const { url } = await appel('/api/v1/gmail/connect');
                    window.location.href = url;
                } catch (e) {
                    setMessageGmail({ type: 'error', text: e.message });
                    setConnectingGmail(false);
                }
            };

            const synchroniserGmail = async () => {
                setSyncingGmail(true);
                try {
                    const r = await appel('/api/v1/gmail/sync', { method: 'POST' });
                    setMessageGmail({ type: 'success', text: r.message });
                    setGmailStatus(await appel('/api/v1/gmail/status'));
                } catch (e) {
                    setMessageGmail({ type: 'error', text: e.message });
                } finally {
                    setSyncingGmail(false);
                }
            };

            const deconnecterGmail = async () => {
                setConfirmerDeconnexionGmail(false);
                try {
                    await appel('/api/v1/gmail/disconnect', { method: 'POST' });
                    setGmailStatus({ connected: false });
                    setMessageGmail({ type: 'success', text: 'Boîte Gmail déconnectée.' });
                } catch (e) {
                    setMessageGmail({ type: 'error', text: e.message });
                }
            };

            const chargerEquipe = async () => {
                try {
                    setTeam(await appel('/api/v1/team'));
                } catch (e) {
                    setMessageTeam({ type: 'error', text: e.message });
                }
            };

            const inviterCollaborateur = async (e) => {
                e.preventDefault();
                setMessageTeam(null);
                setInviting(true);
                try {
                    const r = await appel('/api/v1/team/invite', { method: 'POST', body: JSON.stringify({ email: inviteEmail.trim() }) });
                    setMessageTeam({ type: 'success', text: r.message });
                    setInviteEmail('');
                    await chargerEquipe();
                } catch (e) {
                    setMessageTeam({ type: 'error', text: e.message });
                } finally {
                    setInviting(false);
                }
            };

            const retirerCollaborateur = async (id) => {
                setConfirmerRetrait(null);
                setBusyTeamId(id);
                try {
                    await appel(`/api/v1/team/${id}`, { method: 'DELETE' });
                    await chargerEquipe();
                } catch (e) {
                    setMessageTeam({ type: 'error', text: e.message });
                } finally {
                    setBusyTeamId(null);
                }
            };

            const reactiverCollaborateur = async (id) => {
                setBusyTeamId(id);
                try {
                    await appel(`/api/v1/team/${id}/reactivate`, { method: 'PUT' });
                    await chargerEquipe();
                } catch (e) {
                    setMessageTeam({ type: 'error', text: e.message });
                } finally {
                    setBusyTeamId(null);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.replace('/login.html');
            };

            const set = (k, v) => { setForm({ ...form, [k]: v }); setMessage(null); };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage(null);
                if (form.nouveau.length < 10) {
                    setMessage({ type: 'error', text: 'Le nouveau mot de passe doit contenir au moins 10 caractères' });
                    return;
                }
                if (form.nouveau !== form.confirmation) {
                    setMessage({ type: 'error', text: 'Les nouveaux mots de passe ne correspondent pas' });
                    return;
                }
                setSaving(true);
                try {
                    const response = await fetch(`${API_URL}/auth/change-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ current_password: form.actuel, new_password: form.nouveau })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok) {
                        // Les autres appareils sont déconnectés ; celui-ci reçoit un jeton neuf.
                        localStorage.setItem('token', data.token);
                        setForm(VIDE);
                        setMessage({ type: 'success', text: 'Mot de passe modifié. Les autres appareils connectés ont été déconnectés.' });
                    } else if (response.status === 401) {
                        handleLogout();
                    } else if (response.status === 429) {
                        setMessage({ type: 'error', text: 'Trop de tentatives. Réessayez dans quelques minutes.' });
                    } else {
                        setMessage({ type: 'error', text: data.message || 'Modification impossible' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Serveur injoignable : ' + error.message });
                } finally {
                    setSaving(false);
                }
            };

            return (
                <>
                    <header>
                        <div className="header-content">
                            <div className="logo">ZELYRO</div>
                            <nav>
                                <a href="/prospects.html">Leads</a>
                                <a href="/biens.html">Biens</a>
                                <a href="/matching.html">Matching</a>
                                <a href="/propositions.html">Propositions</a>
                                <a href="/dashboard.html">Dashboard</a>
                                <a href="/compte.html" className="active">Compte</a>
                                {user && user.is_admin && <a href="/admin.html">Admin</a>}
                            </nav>
                            <div className="user-info">
                                {user && <span className="user-email">{user.email}</span>}
                                <button className="logout-btn" onClick={handleLogout}>Déconnexion</button>
                            </div>
                        </div>
                    </header>

                    <div className="container">
                        <div className="titre-ligne">
                            <div>
                                <h1 className="page-title">Mon compte</h1>
                                <p className="page-subtitle">Vos informations et l'accès à votre espace.</p>
                            </div>
                        </div>

                        <div className="account-grid">
                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Informations</h2>
                                </div>
                                <dl className="info-list">
                                    <dt>Email</dt>
                                    <dd>{user ? user.email : '…'}</dd>
                                    {user && user.first_name && (<><dt>Prénom</dt><dd>{user.first_name}</dd></>)}
                                    {user && user.company_name && (<><dt>Agence</dt><dd>{user.company_name}</dd></>)}
                                    {user && user.role && (
                                        <><dt>Rôle</dt><dd>{user.role === 'admin' ? "Administrateur de l'agence" : 'Collaborateur'}</dd></>
                                    )}
                                </dl>
                            </div>

                            {forfait && (
                                <div className="panel">
                                    <div className="panel-header">
                                        <h2 className="panel-title">Mon forfait</h2>
                                        <span className="pastille">{forfait.plan.label}</span>
                                    </div>
                                    <p className="panel-note">
                                        Ce que votre forfait autorise, et ce que vous avez déjà utilisé. Les compteurs mensuels
                                        repartent à zéro le 1er de chaque mois. Pour changer de forfait, écrivez à{' '}
                                        <a href="mailto:contact@zelyro.fr?subject=Changement%20de%20forfait%20Zelyro" style={{ color: 'var(--sage-700)' }}>contact@zelyro.fr</a>.
                                    </p>
                                    {[['leads', 'Prospects'], ['properties', 'Biens'], ['mails', 'E-mails envoyés ce mois-ci'], ['extractions', 'Extractions IA ce mois-ci']].map(([k, libelle]) => {
                                        const n = forfait.usage[k], max = forfait.limits[k];
                                        const ratio = max ? n / max : 0;
                                        return (
                                            <div key={k} className="forfait-ligne">
                                                <div className="forfait-libelle">
                                                    <span>{libelle}</span>
                                                    <span className="forfait-chiffres">{n.toLocaleString('fr-FR')} / {max == null ? 'illimité' : max.toLocaleString('fr-FR')}</span>
                                                </div>
                                                {max != null && max > 0 && (
                                                    <div className="usage-piste">
                                                        <div className={`usage-barre ${ratio >= 1 ? 'plein' : ratio >= 0.8 ? 'proche' : ''}`}
                                                            style={{ width: Math.min(100, ratio * 100) + '%' }}></div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Changer le mot de passe</h2>
                                </div>
                                <p className="panel-note">
                                    Choisissez un mot de passe d'au moins 10 caractères, que vous n'utilisez nulle part ailleurs.
                                </p>

                                {message && (
                                    <div className={message.type === 'error' ? 'error' : 'success'}>
                                        {message.text}
                                    </div>
                                )}

                                <form onSubmit={handleSubmit}>
                                    <div className="form-group">
                                        <label>Mot de passe actuel</label>
                                        <input type="password" value={form.actuel}
                                            onChange={(e) => set('actuel', e.target.value)}
                                            autoComplete="current-password" required disabled={saving} />
                                    </div>
                                    <div className="form-group">
                                        <label>Nouveau mot de passe</label>
                                        <input type="password" value={form.nouveau}
                                            onChange={(e) => set('nouveau', e.target.value)}
                                            autoComplete="new-password" minLength={10} required disabled={saving} />
                                    </div>
                                    <div className="form-group">
                                        <label>Confirmer le nouveau mot de passe</label>
                                        <input type="password" value={form.confirmation}
                                            onChange={(e) => set('confirmation', e.target.value)}
                                            autoComplete="new-password" required disabled={saving} />
                                    </div>
                                    <button type="submit" className="btn" disabled={saving}>
                                        {saving ? 'Enregistrement…' : 'Modifier le mot de passe'}
                                    </button>
                                </form>
                            </div>

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Alertes e-mail</h2>
                                </div>
                                <p className="panel-note">
                                    Recevez un e-mail quand un bien correspond à un prospect (score de 70 sur 100
                                    ou plus), quand un import ajoute des prospects qui correspondent à vos biens,
                                    et quand un nouveau prospect arrive via votre formulaire de contact ou via
                                    LeBonCoin/SeLoger. Une même correspondance n'est signalée qu'une fois.
                                </p>
                                {messageAlertes && (
                                    <div className={messageAlertes.type === 'error' ? 'error' : 'success'}>{messageAlertes.text}</div>
                                )}
                                <label className="interrupteur">
                                    <input type="checkbox" checked={alertes === true} disabled={alertes === null}
                                        onChange={(e) => changerAlertes(e.target.checked)} />
                                    <span>Me prévenir par e-mail à l'adresse {user ? user.email : 'de mon compte'}</span>
                                </label>
                            </div>

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Formulaire de contact</h2>
                                </div>
                                <p className="panel-note">
                                    Placez ce lien sur le site de votre agence, dans vos e-mails ou sur vos réseaux :
                                    les personnes qui remplissent le formulaire arrivent directement dans votre
                                    liste de prospects, avec la trace de leur consentement à être recontactées.
                                </p>
                                {messageLien && (
                                    <div className={messageLien.type === 'error' ? 'error' : 'success'}>{messageLien.text}</div>
                                )}
                                {lien && lien.url ? (
                                    <>
                                        <div className="copie-ligne">
                                            <input id="champ-lien" type="text" readOnly value={lien.url}
                                                onFocus={(e) => e.target.select()} aria-label="Adresse du formulaire" />
                                            <button className="btn" onClick={copier}>Copier</button>
                                        </div>
                                        <div className="btn-ligne" style={{ marginTop: '14px' }}>
                                            <a className="btn secondary petit" href={lien.url} target="_blank" rel="noopener">Voir le formulaire</a>
                                            {!confirmerLien ? (
                                                <button className="btn secondary petit" onClick={() => setConfirmerLien(true)}>Créer une nouvelle adresse</button>
                                            ) : (
                                                <>
                                                    <button className="btn danger plein petit" onClick={nouveauLien}>Confirmer : l'ancienne adresse cessera de fonctionner</button>
                                                    <button className="btn secondary petit" onClick={() => setConfirmerLien(false)}>Annuler</button>
                                                </>
                                            )}
                                        </div>
                                        <p className="field-hint">
                                            Une nouvelle adresse est utile en cas de messages indésirables :
                                            l'ancienne est aussitôt désactivée.
                                        </p>
                                    </>
                                ) : !messageLien && <div className="loading" style={{ padding: '20px' }}><div className="loader"></div></div>}
                            </div>

                            {user && user.role === 'admin' && (
                                <div className="panel">
                                    <div className="panel-header">
                                        <h2 className="panel-title">Mon équipe</h2>
                                        {team && (
                                            <span className="panel-count">
                                                {team.used}{team.max_users != null ? ` / ${team.max_users}` : ''} compte{team.used > 1 ? 's' : ''}
                                            </span>
                                        )}
                                    </div>
                                    <p className="panel-note">
                                        Invitez les collaborateurs de votre agence : chacun a son propre compte
                                        (son propre mot de passe), avec un accès complet aux mêmes prospects et
                                        aux mêmes biens que vous. Le nombre de comptes inclus dépend de votre
                                        forfait{team && team.label ? ` (${team.label})` : ''}.
                                    </p>
                                    {messageTeam && (
                                        <div className={messageTeam.type === 'error' ? 'error' : 'success'}>{messageTeam.text}</div>
                                    )}
                                    {team ? (
                                        <>
                                            <form onSubmit={inviterCollaborateur} className="btn-ligne" style={{ alignItems: 'flex-end', flexWrap: 'wrap' }}>
                                                <div className="form-group" style={{ flex: '1 1 240px', marginBottom: 0 }}>
                                                    <label>E-mail du collaborateur</label>
                                                    <input type="email" value={inviteEmail} onChange={(e) => setInviteEmail(e.target.value)}
                                                        placeholder="prenom@agence.fr" required disabled={inviting} />
                                                </div>
                                                <button type="submit" className="btn" disabled={inviting || !inviteEmail.trim()}>
                                                    {inviting ? 'Envoi…' : 'Inviter'}
                                                </button>
                                            </form>

                                            {team.employees.length > 0 && (
                                                <div className="table-scroll" style={{ marginTop: '18px' }}>
                                                    <table className="admin-table">
                                                        <thead>
                                                            <tr>
                                                                <th>Collaborateur</th><th>Prospects suivis</th>
                                                                <th>Statuts changés (30j)</th><th>E-mails envoyés (30j)</th>
                                                                <th>Dernière activité</th><th>Statut</th><th></th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {team.employees.map((emp) => (
                                                                <tr key={emp.id}>
                                                                    <td className="cellule-nom">
                                                                        {emp.first_name || '—'}
                                                                        <small>{emp.email}</small>
                                                                    </td>
                                                                    <td>{emp.prospects_touches}</td>
                                                                    <td>{emp.changements_statut_30j}</td>
                                                                    <td>{emp.mails_envoyes_30j}</td>
                                                                    <td>{emp.derniere_activite ? new Date(emp.derniere_activite).toLocaleDateString('fr-FR') : '—'}</td>
                                                                    <td>
                                                                        {emp.is_active ? <span className="pastille">Actif</span> : <span className="pastille off">Retiré</span>}
                                                                    </td>
                                                                    <td>
                                                                        {emp.is_active ? (
                                                                            confirmerRetrait === emp.id ? (
                                                                                <div className="btn-ligne">
                                                                                    <button className="btn danger plein petit" disabled={busyTeamId === emp.id}
                                                                                        onClick={() => retirerCollaborateur(emp.id)}>Confirmer</button>
                                                                                    <button className="btn secondary petit" onClick={() => setConfirmerRetrait(null)}>Annuler</button>
                                                                                </div>
                                                                            ) : (
                                                                                <button className="btn danger petit" disabled={busyTeamId === emp.id}
                                                                                    onClick={() => setConfirmerRetrait(emp.id)}>Retirer</button>
                                                                            )
                                                                        ) : (
                                                                            <button className="btn secondary petit" disabled={busyTeamId === emp.id}
                                                                                onClick={() => reactiverCollaborateur(emp.id)}>Réactiver</button>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}

                                            {team.invitations.length > 0 && (
                                                <p className="field-hint" style={{ marginTop: '18px' }}>
                                                    Invitation{team.invitations.length > 1 ? 's' : ''} envoyée{team.invitations.length > 1 ? 's' : ''}, en attente d'acceptation : {team.invitations.map((i) => i.email).join(', ')}.
                                                </p>
                                            )}
                                        </>
                                    ) : !messageTeam && <div className="loading" style={{ padding: '20px' }}><div className="loader"></div></div>}
                                </div>
                            )}

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Connexion à votre boîte Gmail</h2>
                                </div>
                                <p className="panel-note">
                                    Zelyro se connecte directement à votre boîte Gmail (lecture seule) pour détecter
                                    automatiquement les notifications LeBonCoin et SeLoger et créer les prospects —
                                    rien à configurer dans votre messagerie.
                                </p>
                                {messageGmail && (
                                    <div className={messageGmail.type === 'error' ? 'error' : 'success'}>{messageGmail.text}</div>
                                )}
                                {gmailStatus ? (
                                    gmailStatus.connected ? (
                                        <>
                                            <p className="field-hint">
                                                Connecté : <strong>{gmailStatus.email}</strong>
                                                {gmailStatus.last_synced_at && (
                                                    <> — dernière synchronisation {new Date(gmailStatus.last_synced_at).toLocaleString('fr-FR')}</>
                                                )}
                                            </p>
                                            {gmailStatus.last_error && (
                                                <div className="error">{gmailStatus.last_error}</div>
                                            )}
                                            <div className="btn-ligne" style={{ marginTop: '14px' }}>
                                                <button className="btn secondary petit" onClick={synchroniserGmail} disabled={syncingGmail}>
                                                    {syncingGmail ? 'Synchronisation…' : 'Synchroniser maintenant'}
                                                </button>
                                                {!confirmerDeconnexionGmail ? (
                                                    <button className="btn secondary petit" onClick={() => setConfirmerDeconnexionGmail(true)}>Déconnecter</button>
                                                ) : (
                                                    <>
                                                        <button className="btn danger plein petit" onClick={deconnecterGmail}>Confirmer la déconnexion</button>
                                                        <button className="btn secondary petit" onClick={() => setConfirmerDeconnexionGmail(false)}>Annuler</button>
                                                    </>
                                                )}
                                            </div>
                                        </>
                                    ) : (
                                        <button className="btn plein" onClick={connecterGmail} disabled={connectingGmail}>
                                            {connectingGmail ? 'Redirection…' : 'Connecter Gmail'}
                                        </button>
                                    )
                                ) : <div className="loading" style={{ padding: '20px' }}><div className="loader"></div></div>}
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
