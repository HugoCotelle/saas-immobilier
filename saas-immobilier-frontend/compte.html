<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELYRO - Mon compte</title>
    <meta name="robots" content="noindex">
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <meta name="theme-color" content="#F6F2EA">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F2EA'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' transform='rotate(45 16 16)' fill='%234F6353'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="zelyro.css">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';
        const VIDE = { actuel: '', nouveau: '', confirmation: '' };

        function App() {
            const [user, setUser] = useState(null);
            const [form, setForm] = useState(VIDE);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState(null);
            const [alertes, setAlertes] = useState(null);      // null tant que non chargé
            const [messageAlertes, setMessageAlertes] = useState(null);
            const [lien, setLien] = useState(null);
            const [messageLien, setMessageLien] = useState(null);
            const [confirmerLien, setConfirmerLien] = useState(false);
            const [forfait, setForfait] = useState(null);
            const [mailCapture, setMailCapture] = useState(null);
            const [messageMailCapture, setMessageMailCapture] = useState(null);
            const [confirmerMailCapture, setConfirmerMailCapture] = useState(false);

            const appel = async (chemin, options = {}) => {
                const r = await fetch(`${API_URL}${chemin}`, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (r.status === 401) { handleLogout(); throw new Error('Session expirée'); }
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data.message || `Erreur ${r.status}`);
                return data;
            };

            useEffect(() => {
                if (!localStorage.getItem('token')) {
                    window.location.replace('/login.html');
                    return;
                }
                const userData = localStorage.getItem('user');
                if (userData) setUser(JSON.parse(userData));
                appel('/auth/profile').then((p) => {
                    setAlertes(p.alerts_enabled !== false);
                    // Met à jour ce que le navigateur sait du compte (forfait, droits d'administration).
                    try {
                        const u = JSON.parse(localStorage.getItem('user') || '{}');
                        const maj = { ...u, plan: p.plan, is_admin: p.is_admin === true };
                        localStorage.setItem('user', JSON.stringify(maj));
                        setUser(maj);
                    } catch (e) { /* sans importance */ }
                }).catch(() => {});
                appel('/api/v1/plan').then(setForfait).catch(() => {});
                appel('/api/v1/capture-link').then(setLien).catch((e) => setMessageLien({ type: 'error', text: e.message }));
                appel('/api/v1/mail-capture').then(setMailCapture).catch((e) => setMessageMailCapture({ type: 'error', text: e.message }));
            }, []);

            const changerAlertes = async (valeur) => {
                setAlertes(valeur);
                setMessageAlertes(null);
                try {
                    await appel('/auth/preferences', { method: 'PUT', body: JSON.stringify({ alerts_enabled: valeur }) });
                    setMessageAlertes({ type: 'success', text: valeur ? 'Alertes activées.' : 'Alertes désactivées.' });
                } catch (e) {
                    setAlertes(!valeur);
                    setMessageAlertes({ type: 'error', text: e.message });
                }
            };

            const copier = async () => {
                try {
                    await navigator.clipboard.writeText(lien.url);
                    setMessageLien({ type: 'success', text: 'Adresse copiée.' });
                } catch (e) {
                    document.getElementById('champ-lien').select();
                    setMessageLien({ type: 'error', text: 'Copie automatique impossible : l\'adresse est sélectionnée, copiez-la avec Ctrl+C.' });
                }
            };

            const nouveauLien = async () => {
                setConfirmerLien(false);
                try {
                    setLien(await appel('/api/v1/capture-link/regenerate', { method: 'POST' }));
                    setMessageLien({ type: 'success', text: 'Nouvelle adresse créée. L\'ancienne ne fonctionne plus.' });
                } catch (e) {
                    setMessageLien({ type: 'error', text: e.message });
                }
            };

            const copierMailCapture = async () => {
                try {
                    await navigator.clipboard.writeText(mailCapture.address);
                    setMessageMailCapture({ type: 'success', text: 'Adresse copiée.' });
                } catch (e) {
                    document.getElementById('champ-mail-capture').select();
                    setMessageMailCapture({ type: 'error', text: 'Copie automatique impossible : l\'adresse est sélectionnée, copiez-la avec Ctrl+C.' });
                }
            };

            const nouvelleAdresseMailCapture = async () => {
                setConfirmerMailCapture(false);
                try {
                    setMailCapture(await appel('/api/v1/mail-capture/regenerate', { method: 'POST' }));
                    setMessageMailCapture({ type: 'success', text: 'Nouvelle adresse créée. L\'ancienne ne fonctionne plus : pensez à mettre à jour votre transfert.' });
                } catch (e) {
                    setMessageMailCapture({ type: 'error', text: e.message });
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.replace('/login.html');
            };

            const set = (k, v) => { setForm({ ...form, [k]: v }); setMessage(null); };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage(null);
                if (form.nouveau.length < 10) {
                    setMessage({ type: 'error', text: 'Le nouveau mot de passe doit contenir au moins 10 caractères' });
                    return;
                }
                if (form.nouveau !== form.confirmation) {
                    setMessage({ type: 'error', text: 'Les nouveaux mots de passe ne correspondent pas' });
                    return;
                }
                setSaving(true);
                try {
                    const response = await fetch(`${API_URL}/auth/change-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ current_password: form.actuel, new_password: form.nouveau })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok) {
                        // Les autres appareils sont déconnectés ; celui-ci reçoit un jeton neuf.
                        localStorage.setItem('token', data.token);
                        setForm(VIDE);
                        setMessage({ type: 'success', text: 'Mot de passe modifié. Les autres appareils connectés ont été déconnectés.' });
                    } else if (response.status === 401) {
                        handleLogout();
                    } else if (response.status === 429) {
                        setMessage({ type: 'error', text: 'Trop de tentatives. Réessayez dans quelques minutes.' });
                    } else {
                        setMessage({ type: 'error', text: data.message || 'Modification impossible' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Serveur injoignable : ' + error.message });
                } finally {
                    setSaving(false);
                }
            };

            return (
                <>
                    <header>
                        <div className="header-content">
                            <div className="logo">ZELYRO</div>
                            <nav>
                                <a href="/prospects.html">Leads</a>
                                <a href="/biens.html">Biens</a>
                                <a href="/matching.html">Matching</a>
                                <a href="/propositions.html">Propositions</a>
                                <a href="/dashboard.html">Dashboard</a>
                                <a href="/compte.html" className="active">Compte</a>
                                {user && user.is_admin && <a href="/admin.html">Admin</a>}
                            </nav>
                            <div className="user-info">
                                {user && <span className="user-email">{user.email}</span>}
                                <button className="logout-btn" onClick={handleLogout}>Déconnexion</button>
                            </div>
                        </div>
                    </header>

                    <div className="container">
                        <div className="titre-ligne">
                            <div>
                                <h1 className="page-title">Mon compte</h1>
                                <p className="page-subtitle">Vos informations et l'accès à votre espace.</p>
                            </div>
                        </div>

                        <div className="account-grid">
                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Informations</h2>
                                </div>
                                <dl className="info-list">
                                    <dt>Email</dt>
                                    <dd>{user ? user.email : '…'}</dd>
                                    {user && user.first_name && (<><dt>Prénom</dt><dd>{user.first_name}</dd></>)}
                                    {user && user.company_name && (<><dt>Agence</dt><dd>{user.company_name}</dd></>)}
                                </dl>
                            </div>

                            {forfait && (
                                <div className="panel">
                                    <div className="panel-header">
                                        <h2 className="panel-title">Mon forfait</h2>
                                        <span className="pastille">{forfait.plan.label}</span>
                                    </div>
                                    <p className="panel-note">
                                        Ce que votre forfait autorise, et ce que vous avez déjà utilisé. Les compteurs mensuels
                                        repartent à zéro le 1er de chaque mois. Pour changer de forfait, écrivez à{' '}
                                        <a href="mailto:contact@zelyro.fr?subject=Changement%20de%20forfait%20Zelyro" style={{ color: 'var(--sage-700)' }}>contact@zelyro.fr</a>.
                                    </p>
                                    {[['leads', 'Prospects'], ['properties', 'Biens'], ['mails', 'E-mails envoyés ce mois-ci'], ['extractions', 'Extractions IA ce mois-ci']].map(([k, libelle]) => {
                                        const n = forfait.usage[k], max = forfait.limits[k];
                                        const ratio = max ? n / max : 0;
                                        return (
                                            <div key={k} className="forfait-ligne">
                                                <div className="forfait-libelle">
                                                    <span>{libelle}</span>
                                                    <span className="forfait-chiffres">{n.toLocaleString('fr-FR')} / {max == null ? 'illimité' : max.toLocaleString('fr-FR')}</span>
                                                </div>
                                                {max != null && max > 0 && (
                                                    <div className="usage-piste">
                                                        <div className={`usage-barre ${ratio >= 1 ? 'plein' : ratio >= 0.8 ? 'proche' : ''}`}
                                                            style={{ width: Math.min(100, ratio * 100) + '%' }}></div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Changer le mot de passe</h2>
                                </div>
                                <p className="panel-note">
                                    Choisissez un mot de passe d'au moins 10 caractères, que vous n'utilisez nulle part ailleurs.
                                </p>

                                {message && (
                                    <div className={message.type === 'error' ? 'error' : 'success'}>
                                        {message.text}
                                    </div>
                                )}

                                <form onSubmit={handleSubmit}>
                                    <div className="form-group">
                                        <label>Mot de passe actuel</label>
                                        <input type="password" value={form.actuel}
                                            onChange={(e) => set('actuel', e.target.value)}
                                            autoComplete="current-password" required disabled={saving} />
                                    </div>
                                    <div className="form-group">
                                        <label>Nouveau mot de passe</label>
                                        <input type="password" value={form.nouveau}
                                            onChange={(e) => set('nouveau', e.target.value)}
                                            autoComplete="new-password" minLength={10} required disabled={saving} />
                                    </div>
                                    <div className="form-group">
                                        <label>Confirmer le nouveau mot de passe</label>
                                        <input type="password" value={form.confirmation}
                                            onChange={(e) => set('confirmation', e.target.value)}
                                            autoComplete="new-password" required disabled={saving} />
                                    </div>
                                    <button type="submit" className="btn" disabled={saving}>
                                        {saving ? 'Enregistrement…' : 'Modifier le mot de passe'}
                                    </button>
                                </form>
                            </div>

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Alertes e-mail</h2>
                                </div>
                                <p className="panel-note">
                                    Recevez un e-mail quand un bien correspond à un prospect (score de 70 sur 100
                                    ou plus), quand un import ajoute des prospects qui correspondent à vos biens,
                                    et quand un nouveau prospect arrive via votre formulaire de contact ou via
                                    LeBonCoin/SeLoger. Une même correspondance n'est signalée qu'une fois.
                                </p>
                                {messageAlertes && (
                                    <div className={messageAlertes.type === 'error' ? 'error' : 'success'}>{messageAlertes.text}</div>
                                )}
                                <label className="interrupteur">
                                    <input type="checkbox" checked={alertes === true} disabled={alertes === null}
                                        onChange={(e) => changerAlertes(e.target.checked)} />
                                    <span>Me prévenir par e-mail à l'adresse {user ? user.email : 'de mon compte'}</span>
                                </label>
                            </div>

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Formulaire de contact</h2>
                                </div>
                                <p className="panel-note">
                                    Placez ce lien sur le site de votre agence, dans vos e-mails ou sur vos réseaux :
                                    les personnes qui remplissent le formulaire arrivent directement dans votre
                                    liste de prospects, avec la trace de leur consentement à être recontactées.
                                </p>
                                {messageLien && (
                                    <div className={messageLien.type === 'error' ? 'error' : 'success'}>{messageLien.text}</div>
                                )}
                                {lien && lien.url ? (
                                    <>
                                        <div className="copie-ligne">
                                            <input id="champ-lien" type="text" readOnly value={lien.url}
                                                onFocus={(e) => e.target.select()} aria-label="Adresse du formulaire" />
                                            <button className="btn" onClick={copier}>Copier</button>
                                        </div>
                                        <div className="btn-ligne" style={{ marginTop: '14px' }}>
                                            <a className="btn secondary petit" href={lien.url} target="_blank" rel="noopener">Voir le formulaire</a>
                                            {!confirmerLien ? (
                                                <button className="btn secondary petit" onClick={() => setConfirmerLien(true)}>Créer une nouvelle adresse</button>
                                            ) : (
                                                <>
                                                    <button className="btn danger plein petit" onClick={nouveauLien}>Confirmer : l'ancienne adresse cessera de fonctionner</button>
                                                    <button className="btn secondary petit" onClick={() => setConfirmerLien(false)}>Annuler</button>
                                                </>
                                            )}
                                        </div>
                                        <p className="field-hint">
                                            Une nouvelle adresse est utile en cas de messages indésirables :
                                            l'ancienne est aussitôt désactivée.
                                        </p>
                                    </>
                                ) : !messageLien && <div className="loading" style={{ padding: '20px' }}><div className="loader"></div></div>}
                            </div>

                            <div className="panel">
                                <div className="panel-header">
                                    <h2 className="panel-title">Leads LeBonCoin &amp; SeLoger</h2>
                                </div>
                                <p className="panel-note">
                                    LeBonCoin et SeLoger ne proposent pas d'API pour récupérer vos contacts
                                    automatiquement : la seule solution fiable est de transférer leurs e-mails de
                                    notification vers l'adresse ci-dessous. Zelyro les lit et crée le prospect, avec
                                    la bonne source. <strong>Cette adresse se configure dans votre messagerie
                                    (Gmail, Outlook…), jamais dans les paramètres LeBonCoin ou SeLoger</strong> :
                                    ces portails n'ont rien à savoir de Zelyro.
                                </p>
                                {messageMailCapture && (
                                    <div className={messageMailCapture.type === 'error' ? 'error' : 'success'}>{messageMailCapture.text}</div>
                                )}
                                {mailCapture && mailCapture.address ? (
                                    <>
                                        <div className="copie-ligne">
                                            <input id="champ-mail-capture" type="text" readOnly value={mailCapture.address}
                                                onFocus={(e) => e.target.select()} aria-label="Adresse de capture des leads" />
                                            <button className="btn" onClick={copierMailCapture}>Copier</button>
                                        </div>
                                        <ol className="mail-capture-etapes">
                                            <li>Copiez l'adresse ci-dessus.</li>
                                            <li>Dans votre messagerie (Gmail par exemple), ouvrez les paramètres puis « Filtres et adresses bloquées » (ou l'équivalent selon votre messagerie).</li>
                                            <li>Créez un filtre : <em>si l'expéditeur contient leboncoin.fr ou seloger.com</em> → <em>transférer vers</em> cette adresse.</li>
                                            <li>C'est fini : chaque nouvelle notification LeBonCoin ou SeLoger devient automatiquement un prospect dans Zelyro.</li>
                                        </ol>
                                        <p className="field-hint" style={{ marginTop: '2px' }}>Deux minutes à faire, une seule fois.</p>
                                        <div className="btn-ligne" style={{ marginTop: '14px' }}>
                                            {!confirmerMailCapture ? (
                                                <button className="btn secondary petit" onClick={() => setConfirmerMailCapture(true)}>Créer une nouvelle adresse</button>
                                            ) : (
                                                <>
                                                    <button className="btn danger plein petit" onClick={nouvelleAdresseMailCapture}>Confirmer : l'ancienne adresse cessera de fonctionner</button>
                                                    <button className="btn secondary petit" onClick={() => setConfirmerMailCapture(false)}>Annuler</button>
                                                </>
                                            )}
                                        </div>
                                        <p className="field-hint">
                                            Une nouvelle adresse est utile en cas de messages indésirables : l'ancienne
                                            est aussitôt désactivée, pensez à mettre à jour votre filtre de transfert.
                                        </p>
                                    </>
                                ) : !messageMailCapture && <div className="loading" style={{ padding: '20px' }}><div className="loader"></div></div>}
                            </div>
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
