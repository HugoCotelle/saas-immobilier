<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELYRO - Mot de passe oublié</title>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <meta name="theme-color" content="#F6F2EA">
    <link rel="stylesheet" href="zelyro.css">
</head>
<body class="auth">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';

        function ForgotApp() {
            const [email, setEmail] = useState('');
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);
            const [envoye, setEnvoye] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage(null);
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email.trim() })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok) {
                        setEnvoye(true);
                        setMessage({ type: 'success', text: data.message });
                    } else if (response.status === 429) {
                        setMessage({ type: 'error', text: 'Trop de demandes. Réessayez dans une heure.' });
                    } else {
                        setMessage({ type: 'error', text: data.message || 'Demande impossible' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Serveur injoignable : ' + error.message });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-container">
                    <div className="auth-header">
                        <h1>ZELYRO</h1>
                        <p>Mot de passe oublié</p>
                    </div>

                    {message && (
                        <div className={message.type === 'error' ? 'error' : 'success'}>
                            {message.text}
                        </div>
                    )}

                    {!envoye && (
                        <form onSubmit={handleSubmit}>
                            <p className="lead-text">
                                Saisissez l'adresse e-mail de votre compte. Nous vous enverrons
                                un lien pour choisir un nouveau mot de passe.
                            </p>
                            <div className="form-group">
                                <label>Email</label>
                                <input type="email" value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="vous@agence.fr" autoComplete="email"
                                    required disabled={loading} />
                            </div>
                            <button type="submit" disabled={loading}>
                                {loading ? 'Envoi…' : 'Envoyer le lien'}
                            </button>
                        </form>
                    )}

                    {envoye && (
                        <p className="lead-text">
                            Pensez à regarder dans vos courriers indésirables si le message n'arrive pas
                            dans quelques minutes.
                        </p>
                    )}

                    <div className="auth-footer">
                        <a href="/login.html">← Retour à la connexion</a>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ForgotApp />, document.getElementById('root'));
    </script>
</body>
</html>
