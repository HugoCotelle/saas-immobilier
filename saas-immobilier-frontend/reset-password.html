<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ZELYRO - Nouveau mot de passe</title>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <meta name="theme-color" content="#F6F2EA">
    <link rel="stylesheet" href="zelyro.css">
</head>
<body class="auth">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';

        // Le lien de l'e-mail place le jeton après le # : il n'est jamais envoyé
        // au serveur du site. On le lit une fois, puis on l'efface de la barre d'adresse.
        const JETON = (() => {
            const m = window.location.hash.match(/token=([\w-]+)/);
            if (m) window.history.replaceState(null, '', window.location.pathname);
            return m ? m[1] : null;
        })();

        function ResetApp() {
            const [form, setForm] = useState({ nouveau: '', confirmation: '' });
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState(null);
            const [fait, setFait] = useState(false);
            const [lienMort, setLienMort] = useState(!JETON);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setMessage(null);
                if (form.nouveau.length < 10) {
                    setMessage({ type: 'error', text: 'Le mot de passe doit contenir au moins 10 caractères' });
                    return;
                }
                if (form.nouveau !== form.confirmation) {
                    setMessage({ type: 'error', text: 'Les mots de passe ne correspondent pas' });
                    return;
                }
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: JETON, new_password: form.nouveau })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (response.ok) {
                        // Une session ouverte dans ce navigateur n'est plus valable.
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        setFait(true);
                        setMessage({ type: 'success', text: data.message || 'Mot de passe modifié.' });
                    } else if (response.status === 429) {
                        setMessage({ type: 'error', text: 'Trop de tentatives. Réessayez dans une heure.' });
                    } else if (data.message && data.message.startsWith('Ce lien')) {
                        setLienMort(true);
                    } else {
                        setMessage({ type: 'error', text: data.message || 'Modification impossible' });
                    }
                } catch (error) {
                    setMessage({ type: 'error', text: 'Serveur injoignable : ' + error.message });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="auth-container">
                    <div className="auth-header">
                        <h1>ZELYRO</h1>
                        <p>Choisissez un nouveau mot de passe</p>
                    </div>

                    {lienMort && !fait && (
                        <>
                            <div className="error">Ce lien est invalide ou a expiré.</div>
                            <a className="btn" href="/forgot-password.html">Faire une nouvelle demande</a>
                        </>
                    )}

                    {message && (
                        <div className={message.type === 'error' ? 'error' : 'success'}>
                            {message.text}
                        </div>
                    )}

                    {fait && <a className="btn" href="/login.html">Se connecter</a>}

                    {!lienMort && !fait && (
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Nouveau mot de passe</label>
                                <input type="password" value={form.nouveau}
                                    onChange={(e) => setForm({ ...form, nouveau: e.target.value })}
                                    placeholder="••••••••" autoComplete="new-password"
                                    minLength={10} required disabled={loading} />
                                <p className="field-hint">10 caractères minimum.</p>
                            </div>
                            <div className="form-group">
                                <label>Confirmer le mot de passe</label>
                                <input type="password" value={form.confirmation}
                                    onChange={(e) => setForm({ ...form, confirmation: e.target.value })}
                                    placeholder="••••••••" autoComplete="new-password"
                                    required disabled={loading} />
                            </div>
                            <button type="submit" disabled={loading}>
                                {loading ? 'Enregistrement…' : 'Enregistrer le mot de passe'}
                            </button>
                        </form>
                    )}

                    {!fait && (
                        <div className="auth-footer">
                            <a href="/login.html">← Retour à la connexion</a>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<ResetApp />, document.getElementById('root'));
    </script>
</body>
</html>
