<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELYRO - Dashboard</title>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script src="vendor/chart.min.js"></script>
    <meta name="theme-color" content="#F6F2EA">
    <link rel="stylesheet" href="zelyro.css">
    <style>
        .content-grid { grid-template-columns: 1fr 1.3fr; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';

        function DashboardApp() {
            const [stats, setStats] = useState(null);
            const [biens, setBiens] = useState([]);
            const [filtre, setFiltre] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [user, setUser] = useState(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                const token = localStorage.getItem('token');
                const userData = localStorage.getItem('user');
                if (!token) {
                    window.location.href = '/login.html';
                    return;
                }
                if (userData) setUser(JSON.parse(userData));
                chargerTout(token);
            }, []);

            const chargerTout = async (token) => {
                try {
                    setLoading(true);
                    const entetes = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

                    // Les deux appels partent ensemble : les enchaîner
                    // doublerait le temps d'attente sur un serveur qui sort
                    // de veille.
                    const [rStats, rBiens] = await Promise.all([
                        fetch(`${API_URL}/api/v1/stats`, { headers: entetes }),
                        fetch(`${API_URL}/api/v1/properties`, { headers: entetes })
                    ]);

                    if (rStats.status === 401 || rBiens.status === 401) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = '/login.html';
                        return;
                    }
                    if (!rStats.ok) throw new Error(`Erreur API: ${rStats.status}`);
                    if (!rBiens.ok) throw new Error(`Erreur API: ${rBiens.status}`);

                    const dStats = await rStats.json();
                    const dBiens = await rBiens.json();
                    setStats(dStats);
                    setBiens(dBiens);
                    setError(null);
                    setTimeout(() => { initChart(dStats); }, 100);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const initChart = (statsData) => {
                if (!chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Prospects', 'Biens'],
                        datasets: [{
                            data: [statsData.total_leads || 0, statsData.total_properties || 0],
                            backgroundColor: ['#4F6353', '#CDBB98'],
                            borderColor: '#FFFDF9',
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '68%',
                        plugins: { legend: { position: 'bottom', labels: { font: { size: 13, family: "'Inter', sans-serif" }, color: '#465149', padding: 20, usePointStyle: true, pointStyle: 'circle' } } }
                    }
                });
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            };

            const f = filtre.trim().toLowerCase();
            const biensFiltres = f
                ? biens.filter((b) =>
                    (b.title || '').toLowerCase().includes(f) ||
                    (b.address || '').toLowerCase().includes(f) ||
                    (b.property_type || '').toLowerCase().includes(f))
                : biens;

            return (
                <>
                    <header>
                        <div className="header-content">
                            <div className="logo">ZELYRO</div>
                            <nav>
                                <a href="/index.html">Leads</a>
                                <a href="/biens.html">Biens</a>
                                <a href="/matching.html">Matching</a>
                                <a href="/dashboard.html" className="active">Dashboard</a>
                                <a href="/compte.html">Compte</a>
                            </nav>
                            <div className="user-info">
                                {user && <span className="user-email">{user.email}</span>}
                                <button className="logout-btn" onClick={handleLogout}>Déconnexion</button>
                            </div>
                        </div>
                    </header>

                    <div className="container">
                        <h1 className="page-title">Dashboard</h1>
                        <p className="page-subtitle">Vue d'ensemble de votre agence</p>

                        {error && <div className="error">Erreur: {error}</div>}

                        {loading ? (
                            <div className="loading">
                                <div className="loader"></div>
                                <p style={{ marginTop: '20px' }}>Chargement...</p>
                            </div>
                        ) : (
                            <>
                                {stats && (
                                    <div className="stats-grid">
                                        <div className="stat-card">
                                            <div className="stat-value">{stats.total_leads || 0}</div>
                                            <div className="stat-label">Prospects</div>
                                        </div>
                                        <div className="stat-card">
                                            <div className="stat-value">{stats.total_properties || 0}</div>
                                            <div className="stat-label">Biens au portefeuille</div>
                                        </div>
                                        <div className="stat-card">
                                            <div className="stat-value">{stats.unique_leads || 0}</div>
                                            <div className="stat-label">Prospects uniques</div>
                                        </div>
                                    </div>
                                )}

                                <div className="content-grid">
                                    <div className="panel">
                                        <div className="panel-header">
                                            <div className="panel-title">Répartition</div>
                                        </div>
                                        <div className="panel-note">
                                            Le rapport entre vos prospects et vos biens. Un déséquilibre
                                            marqué dans un sens ou dans l'autre explique souvent un
                                            faible nombre de correspondances.
                                        </div>
                                        <div className="chart-wrapper">
                                            <canvas ref={chartRef}></canvas>
                                        </div>
                                    </div>

                                    <div className="panel">
                                        <div className="panel-header">
                                            <div className="panel-title">Portefeuille</div>
                                            <div className="panel-count">
                                                {biensFiltres.length}
                                                {f && ` sur ${biens.length}`}
                                            </div>
                                        </div>
                                        <div className="panel-note">
                                            Tous les biens de votre agence.
                                        </div>

                                        {biens.length > 0 && (
                                            <input className="recherche" type="text" value={filtre}
                                                onChange={(e) => setFiltre(e.target.value)}
                                                placeholder="Filtrer par titre, adresse ou type..." />
                                        )}

                                        {biens.length === 0 ? (
                                            <div className="empty-state">
                                                Aucun bien au portefeuille.
                                            </div>
                                        ) : biensFiltres.length === 0 ? (
                                            <div className="empty-state">
                                                Aucun bien ne correspond à « {filtre} ».
                                            </div>
                                        ) : (
                                            <div className="biens-liste">
                                                {biensFiltres.map((b) => (
                                                    <div key={b.id} className="bien-card">
                                                        <div className="bien-header">
                                                            <div className="bien-titre">{b.title}</div>
                                                            <div className="bien-prix">
                                                                {b.price ? `${b.price.toLocaleString('fr-FR')} €` : '—'}
                                                            </div>
                                                        </div>
                                                        <div className="bien-adresse">
                                                            {b.address || 'Adresse non renseignée'}
                                                        </div>
                                                        <div className="bien-details">
                                                            {b.rooms ? `${b.rooms} pièces` : 'Pièces non renseignées'}
                                                            {' · '}
                                                            {b.size ? `${b.size} m²` : 'Surface non renseignée'}
                                                        </div>
                                                        {b.property_type && (
                                                            <span className="bien-type">{b.property_type}</span>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                </>
            );
        }

        ReactDOM.render(<DashboardApp />, document.getElementById('root'));
    </script>
</body>
</html>
