<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELYRO - Prospects</title>
    <meta name="robots" content="noindex">
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <meta name="theme-color" content="#F6F2EA">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F6F2EA'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' transform='rotate(45 16 16)' fill='%234F6353'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="zelyro.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script src="/pwa.js" defer></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'https://saas-immobilier-921a.onrender.com';

        const SITUATIONS = [
            ['cdi', 'CDI'], ['fonctionnaire', 'Fonctionnaire'], ['cdd', 'CDD ou intérim'],
            ['independant', "Indépendant ou chef d'entreprise"], ['retraite', 'Retraité'],
            ['etudiant', 'Étudiant'], ['autre', 'Autre']
        ];
        const estLocation = (l) => l.transaction === 'location';

        // Numéro au format international sans « + » (06 12 34 56 78 -> 33612345678), pour tel: et WhatsApp.
        const numeroInternational = (tel) => {
            const d = String(tel || '').replace(/[^\d+]/g, '');
            if (!d) return '';
            if (d[0] === '+') return d.slice(1).replace(/\D/g, '');
            if (d.startsWith('00')) return d.slice(2);
            if (d[0] === '0' && d.length === 10) return '33' + d.slice(1);
            return d;
        };
        const prenomPourMessage = (nom) => {
            const n = String(nom || '').trim();
            if (!n || /^Contact (LeBonCoin|SeLoger|\()/.test(n)) return '';
            return n.split(' ')[0];
        };

        // Palier de couleur selon le score /100 (voir zelyro.css). Sans score, on retombe sur le niveau historique.
        const palier = (score, q) => typeof score !== 'number'
            ? (q === 'hot' ? 'p-vert' : q === 'warm' ? 'p-orange' : 'p-gris')
            : score >= 90 ? 'p-go' : score >= 80 ? 'p-vert' : score >= 65 ? 'p-jaune' : score >= 45 ? 'p-orange' : 'p-gris';

        // Catégories de prospects (une par palier de couleur), de la plus chaude à la plus froide.
        const CATEGORIES = [
            ['p-go', 'À appeler maintenant (90 et +)'],
            ['p-vert', 'Très bon prospect (80 à 89)'],
            ['p-jaune', 'Bon prospect (65 à 79)'],
            ['p-orange', 'À suivre (45 à 64)'],
            ['p-gris', 'Premier contact (moins de 45)']
        ];
        const rangCategorie = (l) => CATEGORIES.findIndex((c) => c[0] === palier(l.quality_score, l.lead_quality || 'cold'));
        const scoreDe = (l) => (typeof l.quality_score === 'number' ? l.quality_score : -1);

        const BADGES = {
            hot: ['badge-hot', 'Acheteur actif'],
            warm: ['badge-warm', 'Projet en cours'],
            cold: ['badge-cold', 'Premier contact']
        };

        // Tri alphabétique sur le nom de famille (le nom est saisi « Prénom Nom »),
        // sans tenir compte des accents ni des majuscules. Le nom de famille est le
        // dernier mot, précédé de ses particules : « Marie Le Gall » se classe à L,
        // « Charles de Gaulle » à G (de, du et des sont ignorés). À nom égal, on
        // départage par le prénom.
        const PARTICULES = ['de', 'du', 'des', 'le', 'la', 'les', 'van', 'von', 'der', 'den', 'di', 'da', 'del'];
        const cleNom = (nom) => {
            const mots = String(nom || '').trim().split(/\s+/).filter(Boolean);
            if (mots.length <= 1) return mots.join(' ');
            let debut = mots.length - 1;
            while (debut > 0 && PARTICULES.includes(mots[debut - 1].toLowerCase())) debut--;
            const famille = mots.slice(debut).join(' ').replace(/^(de|du|des)\s+/i, '');
            return famille + ' ' + mots.slice(0, debut).join(' ');
        };
        const parNom = (a, b) => cleNom(a.name).localeCompare(cleNom(b.name), 'fr', { sensitivity: 'base' });

        const normaliser = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        const correspond = (lead, recherche) => {
            const termes = normaliser(recherche).split(/\s+/).filter(Boolean);
            if (termes.length === 0) return true;
            const texte = normaliser([lead.name, lead.email, lead.phone, lead.location, lead.property_type, lead.transaction === 'location' ? 'location locataire' : ''].join(' '));
            return termes.every((t) => texte.includes(t));
        };

        const STATUTS = [
            ['nouveau', 'Nouveau'], ['contacte', 'Contacté'], ['visite', 'Visite'],
            ['offre', 'Offre'], ['signe', 'Signé'], ['perdu', 'Perdu']
        ];
        const libelleStatut = (v) => (STATUTS.find((x) => x[0] === v) || STATUTS[0])[1];
        const deuxChiffres = (n) => String(n).padStart(2, '0');
        const aujourdhui = () => {
            const d = new Date();
            return `${d.getFullYear()}-${deuxChiffres(d.getMonth() + 1)}-${deuxChiffres(d.getDate())}`;
        };
        const dateCourte = (iso) => {
            const [a, m, j] = iso.split('-').map(Number);
            return new Date(a, m - 1, j).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
        };

        const VIDE = {
            name: '', email: '', phone: '', budget: '',
            location: '', property_type: '', surface_min: '', activite: '',
            financing_status: 'unknown', purchase_urgency: 'unknown',
            transaction: 'vente', revenus: '', garants: '', situation_pro: '', meuble_souhaite: '', proprietaire: '', dpe_max: '', ges_max: ''
        };

        // Classe la moins bonne que le prospect accepte : « C ou mieux » = A, B ou C.
        const LIMITES_ENERGIE = [['', 'Indifférent'], ['A', 'A uniquement'], ['B', 'B ou mieux'], ['C', 'C ou mieux'],
            ['D', 'D ou mieux'], ['E', 'E ou mieux'], ['F', 'F ou mieux']];

        function App() {
            const [leads, setLeads] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [message, setMessage] = useState(null);
            const [user, setUser] = useState(null);
            const [formOuvert, setFormOuvert] = useState(false);
            const [exportEnCours, setExportEnCours] = useState(false);
            const [form, setForm] = useState(VIDE);
            const [saving, setSaving] = useState(false);
            const [recherche, setRecherche] = useState('');
            const [filtreStatut, setFiltreStatut] = useState('all');
            const [filtreTransaction, setFiltreTransaction] = useState('tout');   // tout | vente | location
            const [membres, setMembres] = useState([]);
            const [filtreResp, setFiltreResp] = useState('tous');                  // tous | mes | sans
            const [filtreCategorie, setFiltreCategorie] = useState('toutes');      // toutes | p-go | p-vert | ...
            const [tri, setTri] = useState('nom');                                   // nom | meilleurs | faibles

            useEffect(() => {
                const token = localStorage.getItem('token');
                const userData = localStorage.getItem('user');
                if (!token) {
                    window.location.replace('/login.html');
                    return;
                }
                if (userData) setUser(JSON.parse(userData));
                fetchLeads(token);
                fetch(`${API_URL}/api/v1/team/members`, { headers: { 'Authorization': `Bearer ${token}` } })
                    .then((r) => (r.ok ? r.json() : []))
                    .then((m) => setMembres(Array.isArray(m) ? m : []))
                    .catch(() => {});
            }, []);

            const fetchLeads = async (token) => {
                try {
                    setLoading(true);
                    const response = await fetch(`${API_URL}/api/v1/leads`, {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                    });
                    if (!response.ok) {
                        if (response.status === 401) {
                            localStorage.removeItem('token');
                            localStorage.removeItem('user');
                            window.location.replace('/login.html');
                            return;
                        }
                        throw new Error(`Erreur API: ${response.status}`);
                    }
                    const data = await response.json();
                    setLeads(data);
                    setError(null);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const creerLead = async () => {
                if (!form.name.trim()) {
                    setError('Le nom du prospect est obligatoire.');
                    return;
                }
                const token = localStorage.getItem('token');
                setSaving(true);
                try {
                    const response = await fetch(`${API_URL}/api/v1/leads`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({
                            name: form.name.trim(),
                            email: form.email.trim() || null,
                            phone: form.phone.trim() || null,
                            budget: form.budget === '' ? null : parseInt(form.budget, 10),
                            location: form.location.trim() || null,
                            property_type: form.property_type || null,
                            surface_min: ['Local commercial', 'Bureau'].includes(form.property_type) && form.surface_min !== '' ? parseInt(form.surface_min, 10) : null,
                            activite: ['Local commercial', 'Bureau'].includes(form.property_type) && form.activite ? form.activite : null,
                            transaction: form.transaction,
                            // Un locataire n'a pas de financement à valider : on n'envoie que son dossier.
                            financing_status: form.transaction === 'location' ? 'unknown' : form.financing_status,
                            purchase_urgency: form.purchase_urgency,
                            dpe_max: form.dpe_max || null,
                            ges_max: form.ges_max || null,
                            ...(form.transaction === 'location' ? {
                                revenus: form.revenus === '' ? null : parseInt(form.revenus, 10),
                                garants: form.garants === '' || ['Local commercial', 'Bureau'].includes(form.property_type) ? null : parseInt(form.garants, 10),
                                situation_pro: form.situation_pro || null,
                                meuble_souhaite: form.meuble_souhaite === '' ? null : form.meuble_souhaite === 'oui',
                                proprietaire: form.proprietaire === '' ? null : form.proprietaire === 'oui'
                            } : {})
                        })
                    });
                    if (!response.ok) {
                        const d = await response.json().catch(() => ({}));
                        throw new Error(d.message || `Création impossible (${response.status})`);
                    }
                    setMessage(`${form.name.trim()} a été ajouté.`);
                    setForm(VIDE);
                    setFormOuvert(false);
                    setError(null);
                    await fetchLeads(token);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setSaving(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.replace('/login.html');
            };

            // Tous les prospects en CSV (s'ouvre dans Excel). Le fichier est demandé avec le jeton de
            // l'agent puis enregistré depuis le navigateur.
            const exporter = async () => {
                setExportEnCours(true);
                setMessage(null);
                setError(null);
                try {
                    const r = await fetch(`${API_URL}/api/v1/leads/export`, {
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                    if (r.status === 401) { handleLogout(); return; }
                    if (!r.ok) {
                        let m = `Erreur ${r.status}`;
                        try { const j = await r.json(); if (j.message) m = j.message; } catch (e) { /* corps vide */ }
                        throw new Error(m);
                    }
                    const blob = await r.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `prospects-zelyro-${new Date().toISOString().slice(0, 10)}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    setMessage('Export terminé : le fichier est dans vos téléchargements.');
                } catch (e) {
                    setError(e.message);
                } finally {
                    setExportEnCours(false);
                }
            };

            const set = (k, v) => { setForm({ ...form, [k]: v }); setError(null); };

            const statutDe = (lead) => (STATUTS.some((x) => x[0] === lead.status) ? lead.status : 'nouveau');
            const nbLocation = leads.filter(estLocation).length;
            const moi = (membres.find((m) => m.is_me) || {}).id;
            const nomResp = (l) => (membres.find((m) => m.id === l.assigned_to) || {}).name;
            const parRecherche = leads
                .filter((l) => filtreResp === 'tous' || (filtreResp === 'mes' ? l.assigned_to === moi : l.assigned_to == null))
                .filter((l) => filtreTransaction === 'tout' || estLocation(l) === (filtreTransaction === 'location'))
                .filter((l) => correspond(l, recherche));
            const compte = (statut) => parRecherche.filter((l) => statutDe(l) === statut).length;
            const relanceDue = (l) => l.next_reminder && l.next_reminder <= aujourdhui();
            const nbRelances = parRecherche.filter(relanceDue).length;
            const parStatut = parRecherche
                .filter((l) => filtreStatut === 'all' ? true : filtreStatut === 'relance' ? relanceDue(l) : statutDe(l) === filtreStatut);
            const nbCategorie = (cat) => parStatut.filter((l) => palier(l.quality_score, l.lead_quality || 'cold') === cat).length;
            // Dans une catégorie, le meilleur score passe devant, puis l'ordre alphabétique.
            const parCategorie = (sens) => (a, b) => (sens * (rangCategorie(a) - rangCategorie(b))) || (scoreDe(b) - scoreDe(a)) || parNom(a, b);
            const affiches = parStatut
                .filter((l) => filtreCategorie === 'toutes' || palier(l.quality_score, l.lead_quality || 'cold') === filtreCategorie)
                .sort(tri === 'meilleurs' ? parCategorie(1) : tri === 'faibles' ? parCategorie(-1) : parNom);

            return (
                <>
                    <header>
                        <div className="header-content">
                            <div className="logo"><a href="/taches.html" aria-label="Zelyro, mes tâches du jour" style={{ color: 'inherit', textDecoration: 'none' }}>ZELYRO</a></div>
                            <nav>
                                <a href="/taches.html">À faire</a>
                                <a href="/prospects.html" className="active">Leads</a>
                                <a href="/biens.html">Biens</a>
                                <a href="/matching.html">Matching</a>
                                <a href="/propositions.html">Propositions</a>
                                <a href="/dashboard.html">Dashboard</a>
                                <a href="/compte.html">Compte</a>
                                {user && user.is_admin && <a href="/admin.html">Admin</a>}
                            </nav>
                            <div className="user-info">
                                {user && <span className="user-email">{user.email}</span>}
                                <button className="logout-btn" onClick={handleLogout}>Déconnexion</button>
                            </div>
                        </div>
                    </header>

                    <div className="container">
                        <div className="titre-ligne">
                            <div>
                                <h1 className="page-title">Leads</h1>
                                <p className="page-subtitle">
                                    {leads.length} prospect{leads.length > 1 ? 's' : ''} dans votre portefeuille
                                </p>
                            </div>
                            <div className="btn-ligne">
                                <button className="btn secondary" onClick={exporter} disabled={exportEnCours}>
                                    {exportEnCours ? 'Export…' : 'Exporter (CSV)'}
                                </button>
                                <a className="btn secondary" href="/import.html">Importer un fichier</a>
                                <button className="btn" onClick={() => { setFormOuvert(!formOuvert); setMessage(null); }}>
                                    {formOuvert ? 'Fermer' : '+ Ajouter un prospect'}
                                </button>
                            </div>
                        </div>

                        {error && <div className="error">{error}</div>}
                        {message && <div className="success">{message}</div>}

                        {formOuvert && (
                            <div className="panel">
                                <div className="panel-title">Nouveau prospect</div>
                                <div className="panel-note">
                                    Seul le nom est obligatoire. Tout le reste peut être complété
                                    plus tard depuis la fiche — mais plus vous renseignez le
                                    financement et l'échéance, plus le classement sera juste.
                                </div>

                                <div className="form-row">
                                    <div className="form-group">
                                        <label>Il cherche à</label>
                                        <select value={form.transaction} onChange={(e) => set('transaction', e.target.value)}>
                                            <option value="vente">Acheter</option>
                                            <option value="location">Louer</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="form-row">
                                    <div className="form-group">
                                        <label>Nom <span className="obligatoire">*</span></label>
                                        <input type="text" value={form.name}
                                            onChange={(e) => set('name', e.target.value)}
                                            placeholder="Thomas Martin" />
                                    </div>
                                    <div className="form-group">
                                        <label>Email</label>
                                        <input type="email" value={form.email}
                                            onChange={(e) => set('email', e.target.value)}
                                            placeholder="thomas.martin@email.fr" />
                                    </div>
                                    <div className="form-group">
                                        <label>Téléphone</label>
                                        <input type="tel" value={form.phone}
                                            onChange={(e) => set('phone', e.target.value)}
                                            placeholder="0612345678" />
                                    </div>
                                </div>

                                <div className="form-row">
                                    <div className="form-group">
                                        <label>{form.transaction === 'location' ? 'Loyer maximum (€ par mois)' : 'Budget (€)'}</label>
                                        <input type="number" value={form.budget}
                                            onChange={(e) => set('budget', e.target.value)}
                                            placeholder={form.transaction === 'location' ? '900' : '280000'} />
                                    </div>
                                    <div className="form-group">
                                        <label>Secteur recherché</label>
                                        <input type="text" value={form.location}
                                            onChange={(e) => set('location', e.target.value)}
                                            placeholder="Lille" />
                                    </div>
                                    <div className="form-group">
                                        <label>Type de bien</label>
                                        <select value={form.property_type}
                                            onChange={(e) => set('property_type', e.target.value)}>
                                            <option value="">Non précisé</option>
                                            <option value="Appartement">Appartement</option>
                                            <option value="Maison">Maison</option>
                                            <option value="Villa">Villa</option>
                                            <option value="Studio">Studio</option>
                                            <option value="Penthouse">Penthouse</option>
                                            <option value="Terrain">Terrain</option>
                                            <option value="Local commercial">Local commercial</option>
                                            <option value="Bureau">Bureau</option>
                                        </select>
                                    </div>
                                </div>

                                {['Local commercial', 'Bureau'].includes(form.property_type) && (
                                    <div className="form-row">
                                        <div className="form-group">
                                            <label>Surface minimale recherchée (m²)</label>
                                            <input type="number" min="0" value={form.surface_min}
                                                onChange={(e) => set('surface_min', e.target.value)}
                                                placeholder="120" />
                                        </div>
                                        <div className="form-group">
                                            <label>Activité envisagée</label>
                                            <select value={form.activite} onChange={(e) => set('activite', e.target.value)}>
                                                <option value="">Non précisée</option>
                                                <option value="commerce">Commerce de détail</option>
                                                <option value="restauration">Restauration</option>
                                                <option value="services">Services ou profession libérale</option>
                                                <option value="bureau">Bureaux</option>
                                                <option value="artisanat">Artisanat ou activité</option>
                                                <option value="autre">Autre</option>
                                            </select>
                                        </div>
                                    </div>
                                )}

                                {form.transaction === 'location' && (
                                    <div className="form-row">
                                        <div className="form-group">
                                            <label>Revenus mensuels nets du foyer (€)</label>
                                            <input type="number" min="0" value={form.revenus}
                                                onChange={(e) => set('revenus', e.target.value)}
                                                placeholder="2800" />
                                        </div>
                                        {!['Local commercial', 'Bureau'].includes(form.property_type) && (
                                        <div className="form-group">
                                            <label>Nombre de garants</label>
                                            <input type="number" min="0" max="10" value={form.garants}
                                                onChange={(e) => set('garants', e.target.value)}
                                                placeholder="1" />
                                        </div>
                                        )}
                                        <div className="form-group">
                                            <label>Situation professionnelle</label>
                                            <select value={form.situation_pro} onChange={(e) => set('situation_pro', e.target.value)}>
                                                <option value="">Non renseignée</option>
                                                {SITUATIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                )}

                                {form.transaction === 'location' && !['Local commercial', 'Bureau'].includes(form.property_type) && (
                                    <div className="form-row">
                                        <div className="form-group">
                                            <label>Meublé</label>
                                            <select value={form.meuble_souhaite} onChange={(e) => set('meuble_souhaite', e.target.value)}>
                                                <option value="">Indifférent</option>
                                                <option value="oui">Meublé</option>
                                                <option value="non">Non meublé</option>
                                            </select>
                                        </div>
                                    </div>
                                )}

                                <div className="form-row">
                                    <div className="form-group">
                                        <label>DPE accepté</label>
                                        <select value={form.dpe_max} onChange={(e) => set('dpe_max', e.target.value)}>
                                            {LIMITES_ENERGIE.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>GES accepté</label>
                                        <select value={form.ges_max} onChange={(e) => set('ges_max', e.target.value)}>
                                            {LIMITES_ENERGIE.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="form-row">
                                    <div className="form-group">
                                        <label>Déjà propriétaire ?</label>
                                        <select value={form.proprietaire} onChange={(e) => set('proprietaire', e.target.value)}>
                                            <option value="">Inconnu</option>
                                            <option value="oui">Oui, déjà propriétaire</option>
                                            <option value="non">Non</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="form-row">
                                    {form.transaction !== 'location' && (
                                    <div className="form-group">
                                        <label>Financement</label>
                                        <select value={form.financing_status}
                                            onChange={(e) => set('financing_status', e.target.value)}>
                                            <option value="unknown">Non renseigné</option>
                                            <option value="approved">Accord bancaire obtenu</option>
                                            <option value="in_progress">Démarche en cours</option>
                                            <option value="pending">En attente</option>
                                            <option value="rejected">Refusé</option>
                                        </select>
                                    </div>
                                    )}
                                    <div className="form-group">
                                        <label>{form.transaction === 'location' ? "Date d'emménagement souhaitée" : "Échéance d'achat"}</label>
                                        <select value={form.purchase_urgency}
                                            onChange={(e) => set('purchase_urgency', e.target.value)}>
                                            <option value="unknown">Non renseignée</option>
                                            <option value="immediate">Immédiate</option>
                                            <option value="1-3_months">1 à 3 mois</option>
                                            <option value="3-6_months">3 à 6 mois</option>
                                            <option value="6plus_months">Plus de 6 mois</option>
                                        </select>
                                    </div>
                                    <div className="form-group" style={{ display: 'flex', alignItems: 'flex-end' }}>
                                        <button className="btn" onClick={creerLead} disabled={saving}
                                            style={{ width: '100%' }}>
                                            {saving ? 'Enregistrement...' : 'Ajouter le prospect'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {loading ? (
                            <div className="loading">
                                <div className="loader"></div>
                                <p style={{ marginTop: '20px' }}>Chargement des prospects...</p>
                            </div>
                        ) : leads.length === 0 ? (
                            <div className="panel">
                                <div className="empty-state">
                                    Aucun prospect pour le moment.<br />
                                    Utilisez le bouton « Ajouter un prospect » pour commencer.
                                </div>
                            </div>
                        ) : (
                            <>
                            <input className="recherche" type="text" value={recherche}
                                onChange={(e) => setRecherche(e.target.value)}
                                placeholder="Rechercher un prospect (nom, secteur, e-mail...)"
                                aria-label="Rechercher un prospect" />
                            {membres.length > 1 && (
                                <div className="filters">
                                    {[['tous', 'Tous les prospects'], ['mes', 'Mes prospects'], ['sans', 'Sans responsable']].map(([v, l]) => (
                                        <button key={v} className={`filter-button ${filtreResp === v ? 'active' : ''}`}
                                            onClick={() => setFiltreResp(v)}>{l}</button>
                                    ))}
                                </div>
                            )}
                            {nbLocation > 0 && nbLocation < leads.length && (
                                <div className="filters">
                                    {[['tout', 'Achat et location'], ['vente', 'Achat'], ['location', 'Location']].map(([v, l]) => (
                                        <button key={v} className={`filter-button ${filtreTransaction === v ? 'active' : ''}`}
                                            onClick={() => setFiltreTransaction(v)}>{l}</button>
                                    ))}
                                </div>
                            )}
                            <div className="filters">
                                <button className={`filter-button ${filtreStatut === 'all' ? 'active' : ''}`}
                                    onClick={() => setFiltreStatut('all')}>Tous ({parRecherche.length})</button>
                                {STATUTS.map(([valeur, libelle]) => (
                                    <button key={valeur} className={`filter-button ${filtreStatut === valeur ? 'active' : ''}`}
                                        onClick={() => setFiltreStatut(valeur)}>{libelle} ({compte(valeur)})</button>
                                ))}
                                <button className={`filter-button ${filtreStatut === 'relance' ? 'active' : ''}`}
                                    onClick={() => setFiltreStatut('relance')}>À relancer ({nbRelances})</button>
                            </div>
                            <div className="barre-tri">
                                <label>
                                    <span>Catégorie</span>
                                    <select value={filtreCategorie} onChange={(e) => setFiltreCategorie(e.target.value)} aria-label="Filtrer par catégorie">
                                        <option value="toutes">Toutes les catégories ({parStatut.length})</option>
                                        {CATEGORIES.map(([v, l]) => (
                                            <option key={v} value={v}>{l} ({nbCategorie(v)})</option>
                                        ))}
                                    </select>
                                </label>
                                <label>
                                    <span>Trier par</span>
                                    <select value={tri} onChange={(e) => setTri(e.target.value)} aria-label="Trier les prospects">
                                        <option value="nom">Nom (A à Z)</option>
                                        <option value="meilleurs">Catégorie : les meilleurs d'abord</option>
                                        <option value="faibles">Catégorie : les plus faibles d'abord</option>
                                    </select>
                                </label>
                            </div>
                            {affiches.length === 0 ? (
                                <div className="panel"><div className="empty-state">
                                    {recherche.trim() ? `Aucun prospect ne correspond à « ${recherche.trim()} ».` : filtreCategorie !== 'toutes' ? 'Aucun prospect dans cette catégorie.' : 'Aucun prospect dans cette étape.'}
                                </div></div>
                            ) : (
                            <div className="leads-grid">
                                {affiches.map((lead) => {
                                    const q = lead.lead_quality || 'cold';
                                    const [cls, libelle0] = BADGES[q] || BADGES.cold;
                                    const libelle = estLocation(lead) && q === 'hot' ? 'Locataire actif' : libelle0;
                                    const pal = palier(lead.quality_score, q);
                                    const statut = statutDe(lead);
                                    const enRetard = lead.next_reminder && lead.next_reminder < aujourdhui();
                                    return (
                                        <div key={lead.id} className={`lead-card ${q} ${pal}`}>
                                            {pal === 'p-go' && <div className="pastille-go">À appeler maintenant</div>}
                                            {lead.proprietaire === true && <div className="bandeau-proprio">⌂ Déjà propriétaire · à estimer ?</div>}
                                            <div className="lead-name">{lead.name}</div>
                                            <div className="lead-field">
                                                <span className="lead-label">Email :</span>
                                                <span className="lead-value">{lead.email || 'N/A'}</span>
                                            </div>
                                            <div className="lead-field">
                                                <span className="lead-label">Tél. :</span>
                                                <span className="lead-value">{lead.phone || 'N/A'}</span>
                                            </div>
                                            <div className="lead-field">
                                                <span className="lead-label">{estLocation(lead) ? 'Loyer max :' : 'Budget :'}</span>
                                                <span className="lead-value">
                                                    {lead.budget ? `${lead.budget.toLocaleString('fr-FR')} €${estLocation(lead) ? ' / mois' : ''}` : 'N/A'}
                                                </span>
                                            </div>
                                            <div className="lead-field">
                                                <span className="lead-label">Secteur :</span>
                                                <span className="lead-value">{lead.location || 'N/A'}</span>
                                            </div>
                                            <div className="lead-field">
                                                <span className="lead-label">Type :</span>
                                                <span className="lead-value">{lead.property_type || 'N/A'}</span>
                                            </div>
                                            <div className="lead-tags">
                                                <span className={`statut-badge statut-${statut}`}>{libelleStatut(statut)}</span>
                                                {estLocation(lead) && <span className="tag-relance" style={{ background: '#E7EDE4', color: '#4F6353' }}>Location</span>}
                                                {membres.length > 1 && nomResp(lead) && (
                                                    <span className="tag-relance" style={{ background: '#EEF1EC', color: '#3E4F43' }}>
                                                        Responsable : {nomResp(lead)}
                                                    </span>
                                                )}
                                                {lead.next_reminder && (
                                                    <span className={`tag-relance${enRetard ? ' retard' : ''}`}>
                                                        {enRetard ? 'Relance en retard · ' : 'Relance le '}{dateCourte(lead.next_reminder)}
                                                    </span>
                                                )}
                                            </div>
                                            {numeroInternational(lead.phone).length >= 9 && (
                                                <div className="lead-tags">
                                                    <a className="lien-fiche" href={`tel:+${numeroInternational(lead.phone)}`}>Appeler</a>
                                                    <a className="lien-fiche" target="_blank" rel="noopener noreferrer"
                                                        href={`https://wa.me/${numeroInternational(lead.phone)}?text=${encodeURIComponent(
                                                            `Bonjour${prenomPourMessage(lead.name) ? ' ' + prenomPourMessage(lead.name) : ''}, je vous contacte suite à votre demande. Quand seriez-vous disponible pour en parler ?`)}`}>
                                                        WhatsApp
                                                    </a>
                                                </div>
                                            )}
                                            <div className="lead-footer">
                                                <span className={`lead-badge ${cls} ${pal}`}
                                                    title="Score de qualité du prospect. Le détail est sur sa fiche.">
                                                    {libelle}{typeof lead.quality_score === 'number' ? ` · ${lead.quality_score}/100` : ''}
                                                </span>
                                                <a className="lien-fiche" href={`/leads-profile.html?id=${lead.id}`}>
                                                    Ouvrir la fiche →
                                                </a>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            )}
                            </>
                        )}
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
